<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F7FB">
<title>Ընթերցարան</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Noto+Sans+Armenian:wght@400;500;600;700&family=Noto+Serif+Armenian:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7FB; --surface:#FFFFFF; --ink:#172241; --muted:#5A6583; --line:#DDE3EE;
  --marker:#FFE17A; --good:#1E8A5A; --bad:#C23B3B; --accent:#3E5FD9;
  --A1:#2E9E6A; --A2:#1C8AA3; --B1:#3E5FD9; --B2:#7A4FD6; --C1:#B23F78;
  --ui:"Noto Sans Armenian","Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --read:"Literata","Noto Serif Armenian",Georgia,serif;
  --shadow:0 1px 2px rgba(23,34,65,.06),0 8px 24px rgba(23,34,65,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#10162A; --surface:#19213A; --ink:#E9EDF7; --muted:#A4AFC9; --line:#2B3654; --marker:#6E5B10;
  --shadow:none;
}}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 80px}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- Teacher ---------- */
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;
  background:conic-gradient(from 200deg,var(--A1),var(--A2),var(--B1),var(--B2),var(--C1),var(--A1));color:#fff}
.brand h1{font-family:var(--read);font-size:2rem;line-height:1.1;margin:0}
.lead{color:var(--muted);margin:10px 0 22px;max-width:52ch}
.levels{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 16px;scrollbar-width:none}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lv);margin-right:6px;vertical-align:1px}
.list{display:grid;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.item::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--lv)}
.item h2{font-family:var(--read);font-size:1.22rem;line-height:1.25;margin:0 0 6px}
.meta{color:var(--muted);font-size:.9rem;margin:0 0 14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.lv{display:inline-block;background:var(--lv);color:#fff;font-weight:700;font-size:.78rem;border-radius:6px;padding:2px 8px}
.actions{display:flex;gap:8px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-main{background:var(--ink);color:var(--paper);flex:1}
.btn-ghost{background:transparent;border:1.5px solid var(--line)}

.out{margin-left:auto;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:.85rem;color:var(--muted)}
.lock{max-width:340px;margin:12vh auto 0;text-align:center}
.lock .logo{margin:0 auto 14px;width:56px;height:56px;font-size:1.6rem}
.lock h1{font-family:var(--read);font-size:2rem;margin:0}
.lock .lead{margin:6px auto 26px}
.lock form{text-align:left;display:grid;gap:6px}
.pin{font:inherit;font-size:1.5rem;letter-spacing:.4em;text-align:center;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.err{color:var(--bad);min-height:1.4em;margin:2px 0 6px;font-size:.9rem}
.lock .btn-main{padding:13px}

/* Share sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:20;opacity:0;transition:opacity .2s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;
  padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;
  transform:translateY(100%);transition:transform .25s ease;max-height:88vh;overflow:auto}
.sheet.show{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:var(--read);margin:0 0 2px;font-size:1.2rem}
.sheet .sub{color:var(--muted);font-size:.9rem;margin:0 0 16px}
.big{width:100%;display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.big b{display:block}
.big small{color:var(--muted)}
.big .ic{font-size:1.4rem;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tri{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);text-align:center}
.tri .ic{font-size:1.6rem}
.tri b{font-size:1rem}
.tri small{color:var(--muted);font-size:.74rem;line-height:1.25}
.tri.main{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tri.main small{color:inherit;opacity:.75}
.tri:disabled{opacity:.45;cursor:not-allowed}
.apps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 14px}
.app{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.78rem;padding:6px 0;text-decoration:none}
.app i{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;font-style:normal}
.app svg{width:26px;height:26px;fill:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row .btn{border:1.5px solid var(--line);background:transparent;font-size:.92rem;padding:10px 8px}
.label{font-size:.85rem;color:var(--muted);margin:6px 0 4px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:30;transition:.2s;max-width:90vw;text-align:center;font-size:.92rem}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Student ---------- */
.back{color:var(--muted);text-decoration:none;font-size:.9rem}
.essay-head h1{font-family:var(--read);font-size:2.2rem;line-height:1.12;margin:14px 0 10px}
.player{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:10px 0 12px;margin:10px 0 4px;border-bottom:1px solid var(--line)}
.pctl{display:flex;gap:10px;align-items:center}
.play{background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:11px 22px;font-weight:700;min-width:128px}
.speed{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 13px;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--lv)}
.hint{color:var(--muted);font-size:.85rem;margin:8px 0 18px}
.text{font-family:var(--read);font-size:1.2rem;line-height:1.78;max-width:66ch}
.text p{margin:0 0 1em}
.s{border-radius:4px;transition:background .2s;cursor:pointer}
.s.on{background:var(--marker)}
.sec{font-size:1.15rem;margin:36px 0 12px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.word{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.word b{font-family:var(--read)}
.word span{color:var(--muted);font-size:.92rem;text-align:right;flex:1}
.say{border:0;background:transparent;font-size:1rem;padding:2px}
.q{min-width:0;margin:0 0 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.q p{margin:0 0 10px;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:8px}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt.right{background:color-mix(in srgb,var(--good) 16%,transparent)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 16%,transparent)}
.check{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:13px 18px;font-weight:700;width:100%;margin-top:6px}
.score{font-family:var(--read);font-size:1.4rem;text-align:center;margin:18px 0 0}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="essays.js"></script>
<script>
/* ======= Settings ======= */
const TEACHER_NAME = "";          // e.g. "Ms. Anna" — appears in the message if filled
const AUDIO_DIR = "audio/";       // MP3 files made by make_audio.py
// Teacher PIN (default 1234). To change: echo -n YOUR_PIN | sha256sum  → paste the result here
const TEACHER_PIN_HASH = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";

const ESSAYS = window.ESSAYS || [];
const LEVELS = ["A1","A2","B1","B2","C1"];
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wordCount = e => e.text.join(" ").split(/\s+/).length;
const baseUrl = () => location.origin + location.pathname;
const linkFor = e => baseUrl() + "?e=" + e.id;
const isPhone = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

/* audio availability cache */
const audioOK = {};
async function hasAudio(id){
  if(id in audioOK) return audioOK[id];
  if(location.protocol==="file:") return audioOK[id]=false;
  try{ const r=await fetch(AUDIO_DIR+id+".mp3",{method:"HEAD"}); audioOK[id]=r.ok; }
  catch{ audioOK[id]=false; }
  return audioOK[id];
}

function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),2600);
}
async function copy(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch{
    const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); let ok=false; try{ok=document.execCommand("copy")}catch{} ta.remove(); return ok;
  }
}

function route(){
  closeSheet(true); stopAll();
  const id=new URLSearchParams(location.search).get("e");
  const e=ESSAYS.find(x=>x.id===id);
  e ? student(e) : teacher();
  window.scrollTo(0,0);
}
function go(url){ history.pushState(null,"",url); route(); }

/* ================= Lock ================= */
const LS_KEY="reading-room-teacher";
async function sha256(t){
  if(!(window.crypto&&crypto.subtle)) return null;
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function isTeacher(){ try{ return localStorage.getItem(LS_KEY)===TEACHER_PIN_HASH; }catch{ return sessionOK; } }
let sessionOK=false;
function lockScreen(){
  document.title="Ընթերցարան";
  app.innerHTML=`
  <section class="lock">
    <div class="logo" aria-hidden="true">🔒</div>
    <h1>Ընթերցարան</h1>
    <p class="lead">Մուտք միայն ուսուցչի համար</p>
    <form id="lockForm" autocomplete="off">
      <label for="pin" class="label">PIN կոդ</label>
      <input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
      <p class="err" id="err" aria-live="polite"></p>
      <button class="btn btn-main" type="submit">Մուտք</button>
    </form>
  </section>`;
  const pin=document.getElementById("pin"); pin.focus();
  document.getElementById("lockForm").onsubmit=async ev=>{
    ev.preventDefault();
    const h=await sha256(pin.value.trim());
    if(h===TEACHER_PIN_HASH){
      sessionOK=true; try{ localStorage.setItem(LS_KEY,h); }catch{}
      teacher();
    }else{
      document.getElementById("err").textContent= h===null
        ? "Բացիր կայքը https:// հասցեով (օր.՝ GitHub Pages-ով)"
        : "Սխալ PIN, փորձիր նորից";
      pin.value=""; pin.focus();
    }
  };
}
function logout(){ sessionOK=false; try{ localStorage.removeItem(LS_KEY); }catch{} lockScreen(); }

/* ================= Teacher ================= */
let filter="all";
function teacher(){
  if(!isTeacher()&&!sessionOK){ lockScreen(); return; }
  document.title="Ընթերցարան";
  const shown=ESSAYS.filter(e=>filter==="all"||e.level===filter);
  app.innerHTML=`
  <header>
    <div class="brand"><div class="logo" aria-hidden="true">📖</div><h1>Ընթերցարան</h1><button class="out" id="logout">Դուրս գալ</button></div>
    <p class="lead">Ընտրիր դասը և ուղարկիր աշակերտին ցանկացած հավելվածով։ Աշակերտը կկարդա տեքստը, կլսի այն և կպատասխանի հարցերին։</p>
  </header>
  <nav class="levels" aria-label="Մակարդակ">
    <button class="chip" data-f="all" aria-pressed="${filter==="all"}">Բոլորը · ${ESSAYS.length}</button>
    ${LEVELS.map(l=>`<button class="chip" data-f="${l}" aria-pressed="${filter===l}" style="--lv:var(--${l})"><span class="dot"></span>${l}</button>`).join("")}
  </nav>
  <section class="list">
    ${shown.map(e=>`
    <article class="item" style="--lv:var(--${e.level})">
      <h2>${esc(e.title)}</h2>
      <p class="meta"><span class="lv">${e.level}</span><span>${esc(e.topic)}</span><span>${wordCount(e)} բառ</span><span>${e.qs.length} հարց</span><span data-audio="${e.id}"></span></p>
      <div class="actions">
        <button class="btn btn-main" data-share="${e.id}">Ուղարկել</button>
        <a class="btn btn-ghost" href="?e=${e.id}" data-go="${e.id}">Դիտել</a>
      </div>
    </article>`).join("")}
  </section>`;
  document.getElementById("logout").onclick=logout;
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;teacher()});
  app.querySelectorAll("[data-go]").forEach(a=>a.onclick=ev=>{ev.preventDefault();go("?e="+a.dataset.go)});
  app.querySelectorAll("[data-share]").forEach(b=>b.onclick=()=>openSheet(ESSAYS.find(x=>x.id===b.dataset.share)));
  shown.forEach(async e=>{ if(await hasAudio(e.id)){ const s=app.querySelector(`[data-audio="${e.id}"]`); if(s) s.textContent="🎧 ձայն"; }});
}

/* ---- message texts ---- */
function message(e){
  const from = TEACHER_NAME ? `\n— ${TEACHER_NAME}` : "";
  return `Hello! 📖 Your reading for today: "${e.title}" (${e.level})\nRead it, listen to it and answer the questions:\n${linkFor(e)}${from}`;
}
function fullLesson(e){
  const lines=[`📖 ${e.title} (${e.level})`,"",...e.text.flatMap(p=>[p,""]),
    "📝 New words:",...e.words.map(w=>`• ${w[0]} — ${w[1]}`),"",
    "❓ Questions:",...e.qs.map((q,i)=>`${i+1}. ${q[0]}\n   ${q[1].slice().sort().map((o,j)=>String.fromCharCode(97+j)+") "+o).join("   ")}`),"",
    `🎧 Listen online: ${linkFor(e)}`];
  return lines.join("\n");
}

/* ---- icons ---- */
const ICON={
 wa:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7a11.4 11.4 0 0 1-4.5-4c-.3-.5-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.2-.3.3-.1.6.1.3.7 1.2 1.5 1.9 1 .9 1.9 1.2 2.2 1.3.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.1.1.6-.1 1.2Z"/></svg>',
 tg:'<svg viewBox="0 0 24 24"><path d="M21.9 4.6 18.8 19c-.2 1-.8 1.3-1.7.8l-4.6-3.4-2.2 2.1c-.2.2-.5.5-1 .5l.3-4.7 8.6-7.8c.4-.3-.1-.5-.6-.2L6.9 13 2.3 11.6c-1-.3-1-1 .2-1.5L20.5 3c.9-.3 1.6.2 1.4 1.6Z"/></svg>',
 vb:'<svg viewBox="0 0 24 24"><path d="M11.4 2C8.7 2 4.2 2.4 2.9 6.4c-.9 2.8-.9 6.4.1 9.2.6 1.8 2 3 3.6 3.6V22c0 .5.6.7.9.3l2.6-2.9c3.3.2 6.3-.2 8.7-1.6 2.5-1.5 3.2-4.9 3.2-7.9 0-2.4-.4-4.8-1.8-6.2C18.3 2 14.6 2 11.4 2Zm5 13.6c-.5.9-1.4 1-2 .8-2.6-1-5-3-6.5-5.5-.6-1.1-1.3-2.6-.2-3.5.4-.3.9-.5 1.2 0l1.1 1.6c.2.4.2.8-.2 1.1l-.4.3c-.3.3-.1.8.1 1.1.7 1.2 1.7 2.2 3 2.8.3.1.7.2 1-.1l.3-.4c.3-.4.8-.4 1.2-.2l1.5 1c.4.3.3.7-.1 1ZM12 5.2c2.8.1 5.1 2.2 5.2 5.2 0 .3-.4.3-.5 0-.2-2.6-1.9-4.4-4.7-4.6-.3 0-.3-.6 0-.6Zm0 1.5c1.8.1 3.3 1.4 3.4 3.4 0 .3-.4.3-.5 0-.1-1.6-1.2-2.7-2.9-2.8-.3 0-.3-.6 0-.6Zm.1 1.6c.9 0 1.7.7 1.7 1.7 0 .3-.4.3-.4 0 0-.8-.6-1.2-1.3-1.2-.3 0-.3-.5 0-.5Z"/></svg>',

};

/* ---- share sheet ---- */
let sheetEl=null;
async function openSheet(e){
  const audio=await hasAudio(e.id);
  const canShare=!!navigator.share;
  const msg=message(e), link=linkFor(e);
  const apps=[
    {k:"wa",n:"WhatsApp",c:"#1FA855",href:"https://wa.me/?text="+encodeURIComponent(msg)},
    {k:"tg",n:"Telegram",c:"#229ED9",href:"https://t.me/share/url?url="+encodeURIComponent(link)+"&text="+encodeURIComponent(msg.replace("\n"+link,""))},
    {k:"vb",n:"Viber",c:"#7360F2",href:"viber://forward?text="+encodeURIComponent(msg)},
    {k:"ms",n:"Messenger",c:"#0A7CFF",href:isPhone?"fb-messenger://share/?link="+encodeURIComponent(link):"https://www.facebook.com/dialog/send?link="+encodeURIComponent(link)+"&redirect_uri="+encodeURIComponent(link)},
    {k:"ig",n:"Instagram",c:"#D62976",ig:true}
  ];
  const bd=document.createElement("div"); bd.className="backdrop";
  const sh=document.createElement("div"); sh.className="sheet"; sh.setAttribute("role","dialog"); sh.setAttribute("aria-modal","true"); sh.setAttribute("aria-label","Ուղարկել");
  sh.style.setProperty("--lv",`var(--${e.level})`);
  sh.innerHTML=`<div class="grab"></div>
    <h3>${esc(e.title)}</h3>
    <p class="sub">${e.level}, ${esc(e.topic)}</p>
    <div class="three">
      <button class="tri" id="shText"><span class="ic">📄</span><b>Տեքստ</b><small>դասի տեքստը, բառերը, հարցերը</small></button>
      <button class="tri" id="shVoice" ${audio?"":"disabled"}><span class="ic">🎧</span><b>Ձայն</b><small>${audio?"MP3 ֆայլ":"դեռ պատրաստ չէ"}</small></button>
      <button class="tri main" id="shAll"><span class="ic">📦</span><b>Միասին</b><small>${audio?"ձայն + հղում":"հղում"}</small></button>
    </div>
    <p class="label">Հղումն ուղարկել կոնկրետ հավելվածով</p>
    <div class="apps">${apps.map(a=>a.ig
      ?`<button class="app" data-ig><i style="background:${a.c}">${ICON[a.k]}</i>${a.n}</button>`
      :`<a class="app" href="${a.href}" target="_blank" rel="noopener"><i style="background:${a.c}">${ICON[a.k]}</i>${a.n}</a>`).join("")}</div>
    <div class="row">
      <button class="btn" id="cpLink">🔗 Պատճենել հղումը</button>
      <button class="btn" id="cpText">📄 Պատճենել ամբողջ դասը</button>
      ${audio?`<a class="btn" href="${AUDIO_DIR+e.id}.mp3" download="${e.id}.mp3">⬇️ Ներբեռնել ձայնը</a>`:""}
      <button class="btn" id="close">Փակել</button>
    </div>`;
  document.body.append(bd,sh); sheetEl={bd,sh};
  requestAnimationFrame(()=>{bd.classList.add("show");sh.classList.add("show")});
  bd.onclick=()=>closeSheet();
  sh.querySelector("#close").onclick=()=>closeSheet();
  sh.querySelector("#cpLink").onclick=async()=>toast(await copy(msg)?"Հաղորդագրությունը հղումով պատճենվեց":"Չհաջողվեց պատճենել");
  sh.querySelector("#cpText").onclick=async()=>toast(await copy(fullLesson(e))?"Ամբողջ դասը պատճենվեց, տեղադրիր չատում":"Չհաջողվեց պատճենել");
  sh.querySelector("[data-ig]").onclick=async()=>{
    await copy(msg); toast("Պատճենվեց։ Instagram-ում բացիր չատը և տեղադրիր (Paste)");
    setTimeout(()=>{ location.href=isPhone?"instagram://direct-inbox":"https://www.instagram.com/direct/inbox/"; },900);
  };
  const shareOrCopy=async(text,okMsg)=>{
    if(navigator.share){ try{ await navigator.share({text}); }catch{} }
    else toast(await copy(text)?okMsg:"Չհաջողվեց պատճենել");
  };
  sh.querySelector("#shText").onclick=()=>shareOrCopy(fullLesson(e),"Դասի տեքստը պատճենվեց, տեղադրիր չատում");
  sh.querySelector("#shVoice").onclick=async()=>{
    const f=await audioFile(e); if(!f) return;
    if(navigator.canShare&&navigator.canShare({files:[f]})){ try{ await navigator.share({files:[f]}); }catch{} }
    else { downloadFile(f); toast("Ֆայլը ներբեռնվեց, կցիր այն չատում"); }
  };
  sh.querySelector("#shAll").onclick=async()=>{
    const f=audio?await audioFile(e):null;
    if(f&&navigator.canShare&&navigator.canShare({files:[f],text:msg})){ try{ await navigator.share({files:[f],text:msg}); }catch{} }
    else { if(f) toast("Այս սարքը միասին ուղարկել չի կարող, ուղարկվում է հղումը"); shareOrCopy(msg,"Հաղորդագրությունը հղումով պատճենվեց"); }
  };
  document.addEventListener("keydown",escClose);
  sh.querySelector("#shAll").focus();
}
async function audioFile(e){
  try{
    toast("Պատրաստվում է ձայնը…");
    const blob=await (await fetch(AUDIO_DIR+e.id+".mp3")).blob();
    return new File([blob],e.title.replace(/[^\w\s-]/g,"")+".mp3",{type:"audio/mpeg"});
  }catch{ toast("Ձայնը չհաջողվեց բեռնել"); return null; }
}
function downloadFile(f){ const a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); a.remove(); }
function escClose(ev){ if(ev.key==="Escape") closeSheet(); }
function closeSheet(now){
  if(!sheetEl) return; const {bd,sh}=sheetEl; sheetEl=null;
  document.removeEventListener("keydown",escClose);
  if(now){bd.remove();sh.remove();return;}
  bd.classList.remove("show"); sh.classList.remove("show");
  setTimeout(()=>{bd.remove();sh.remove()},260);
}

/* ================= Student ================= */
let sentences=[], cur=0, playing=false, voice=null, token=0;
let audioEl=null, starts=null, fracs=[];
const RATES=[0.75,0.9,1]; let rate=0.9;
const split=p=>p.match(/[^.!?]+[.!?]+["”]?\s*|[^.!?]+$/g)||[p];

function student(e){
  document.title=e.title;
  sentences=[];
  const paras=e.text.map(p=>"<p>"+split(p).map(s=>{sentences.push(s.trim());return `<span class="s" data-i="${sentences.length-1}">${esc(s)}</span>`}).join("")+"</p>").join("");
  let acc=0; const total=sentences.reduce((a,s)=>a+s.length,0);
  fracs=sentences.map(s=>{const f=acc/total; acc+=s.length; return f;});
  const order=e.qs.map(q=>q[1].map((t,i)=>({t,ok:i===0})).sort(()=>Math.random()-.5));
  app.style.setProperty("--lv",`var(--${e.level})`);
  app.innerHTML=`
  ${isTeacher()||sessionOK?`<a class="back" href="./" id="back">← Բոլոր դասերը</a>`:""}
  <header class="essay-head">
    <h1>${esc(e.title)}</h1>
    <p class="meta"><span class="lv">${e.level}</span><span>${esc(e.topic)}</span><span>${wordCount(e)} words</span></p>
  </header>
  <div class="player" id="player" hidden>
    <div class="pctl"><button class="play" id="play">▶ Listen</button>
    <button class="speed" id="speed" aria-label="Reading speed">Speed ${rate}×</button></div>
    <div class="bar"><span id="prog"></span></div>
  </div>
  <p class="hint" id="hint" hidden>Tap any sentence to listen from there.</p>
  <p class="note" id="noaudio" hidden>Listening is not available in this browser. Open the link in Chrome or Safari.</p>
  <article class="text">${paras}</article>

  <h2 class="sec">New words</h2>
  <div class="words">${e.words.map(w=>`<div class="word"><b>${esc(w[0])}</b><span>${esc(w[1])}</span>${"speechSynthesis" in window?`<button class="say" data-say="${esc(w[0])}" aria-label="Listen: ${esc(w[0])}">🔊</button>`:""}</div>`).join("")}</div>

  <h2 class="sec">Questions</h2>
  <div id="quiz">
    ${e.qs.map((q,qi)=>`<fieldset class="q" style="border:1px solid var(--line)"><p>${qi+1}. ${esc(q[0])}</p>
      ${order[qi].map((o,oi)=>`<label class="opt" data-ok="${o.ok}"><input type="radio" name="q${qi}" value="${oi}"><span>${esc(o.t)}</span></label>`).join("")}
    </fieldset>`).join("")}
    <button class="check" id="check" type="button">Check answers</button>
    <p class="score" id="score" aria-live="polite"></p>
  </div>`;
  const bk=document.getElementById("back"); if(bk) bk.onclick=ev=>{ev.preventDefault();go(baseUrl())};
  app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>{pause();sayOnce(b.dataset.say)});
  document.getElementById("check").onclick=()=>checkQuiz(e);
  setupPlayer(e);
}

async function setupPlayer(e){
  const myRoute=++token;
  const mp3=await hasAudio(e.id);
  if(myRoute!==token) return;
  if(mp3){
    audioEl=new Audio(AUDIO_DIR+e.id+".mp3"); audioEl.preload="metadata"; audioEl.playbackRate=rate;
    try{ const r=await fetch(AUDIO_DIR+e.id+".json"); if(r.ok){ const j=await r.json(); if(j.length===sentences.length) starts=j; } }catch{}
    audioEl.ontimeupdate=()=>{
      const d=audioEl.duration||0, t=audioEl.currentTime;
      document.getElementById("prog").style.width=d?(t/d*100)+"%":"0";
      let i=0;
      if(starts){ while(i+1<starts.length&&starts[i+1]<=t) i++; }
      else if(d){ const f=t/d; while(i+1<fracs.length&&fracs[i+1]<=f) i++; }
      if(playing) mark(i);
    };
    audioEl.onended=()=>{playing=false;mark(-1);setBtn()};
  }else if(!("speechSynthesis" in window)){
    document.getElementById("noaudio").hidden=false; return;
  }else pickVoice();
  document.getElementById("player").hidden=false;
  document.getElementById("hint").hidden=false;
  document.getElementById("play").onclick=()=>playing?pause():playFrom(audioEl?null:cur);
  document.getElementById("speed").onclick=ev=>{
    rate=RATES[(RATES.indexOf(rate)+1)%RATES.length]; ev.currentTarget.textContent=`Speed ${rate}×`;
    if(audioEl) audioEl.playbackRate=rate; else if(playing) playFrom(cur);
  };
  app.querySelectorAll(".s").forEach(s=>s.onclick=()=>playFrom(+s.dataset.i));
}

function playFrom(i){
  if(audioEl){
    if(i!=null){
      const seek=()=>{ audioEl.currentTime=starts?starts[i]:fracs[i]*(audioEl.duration||0); };
      audioEl.readyState>=1?seek():audioEl.addEventListener("loadedmetadata",seek,{once:true});
    }
    playing=true; setBtn(); audioEl.play().catch(()=>{playing=false;setBtn()}); return;
  }
  speechSynthesis.cancel();
  if(i>=sentences.length) i=0;
  cur=i; playing=true; setBtn();
  const my=++token;
  const next=()=>{
    if(my!==token||!playing) return;
    if(cur>=sentences.length){playing=false;cur=0;mark(-1);setBtn();prog(0);return}
    mark(cur); prog(cur/sentences.length);
    const u=utter(sentences[cur]);
    u.onend=()=>{if(my===token&&playing){cur++;next()}};
    u.onerror=()=>{if(my===token){playing=false;setBtn()}};
    speechSynthesis.speak(u);
  };
  next();
}
function pause(){
  playing=false; setBtn();
  if(audioEl) audioEl.pause(); else if("speechSynthesis" in window){token++;speechSynthesis.cancel();}
}
function stopAll(){
  playing=false; token++; cur=0; starts=null; lastMark=-2;
  if(audioEl){audioEl.pause();audioEl=null;}
  if("speechSynthesis" in window) speechSynthesis.cancel();
}
function pickVoice(){
  const choose=()=>{
    const v=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
    voice=v.find(x=>/Google UK English Female|Samantha|Daniel|Google US English|Karen|Serena/i.test(x.name))||v.find(x=>/en[-_]GB/i.test(x.lang))||v[0]||null;
  };
  choose(); speechSynthesis.onvoiceschanged=choose;
}
function utter(text){ const u=new SpeechSynthesisUtterance(text); u.lang=voice?voice.lang:"en-GB"; if(voice)u.voice=voice; u.rate=rate; return u; }
function sayOnce(t){ if("speechSynthesis" in window){ speechSynthesis.cancel(); speechSynthesis.speak(utter(t)); } }
function prog(f){ const p=document.getElementById("prog"); if(p) p.style.width=(f*100)+"%"; }
let lastMark=-2;
function mark(i){
  if(i===lastMark) return; lastMark=i;
  app.querySelectorAll(".s.on").forEach(s=>s.classList.remove("on"));
  const s=app.querySelector(`.s[data-i="${i}"]`);
  if(s){ s.classList.add("on"); s.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); }
}
function setBtn(){ const b=document.getElementById("play"); if(b) b.textContent=playing?"❚❚ Pause":"▶ Listen"; }

function checkQuiz(e){
  let right=0, answered=0;
  e.qs.forEach((_,qi)=>{
    app.querySelectorAll(`input[name=q${qi}]`).forEach(inp=>{
      const l=inp.closest(".opt"); l.classList.remove("right","wrong");
      if(l.dataset.ok==="true") l.classList.add("right");
      if(inp.checked){ answered++; if(l.dataset.ok==="true") right++; else l.classList.add("wrong"); }
    });
  });
  document.getElementById("score").textContent = answered<e.qs.length
    ? `You answered ${answered} of ${e.qs.length}. Correct: ${right}.`
    : `You got ${right} of ${e.qs.length} ${right===e.qs.length?"🎉 Excellent!":"— read it again and try once more!"}`;
}

window.addEventListener("popstate",route);
route();
</script>
