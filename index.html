<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5FB">
<title>Gayane Torosyan | English Reading Room</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Gayane English">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Noto+Sans+Armenian:wght@400;500;600;700&family=Noto+Serif+Armenian:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F5FB; --surface:#FFFFFF; --ink:#18183A; --muted:#5E5E80; --line:#E3E1EF;
  --marker:#FFE17A; --sent:rgba(246,196,40,.045); --wordhl:rgba(255,212,59,.55); --good:#1E8A5A; --bad:#C23B3B; --accent:#6C4CE4; --brand:#7A5CEB; --brand2:#A891F7;
  --A1:#2E9E6A; --A2:#1C8AA3; --B1:#3E5FD9; --B2:#7A4FD6; --C1:#B23F78;
  --ui:"Noto Sans Armenian","Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --read:"Literata","Noto Serif Armenian",Georgia,serif;
  --shadow:0 1px 2px rgba(24,24,58,.06),0 8px 24px rgba(24,24,58,.07);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#A48EF7; --accent:#8C72F0; --paper:#0E1022; --surface:#181A36; --ink:#ECEBF7; --muted:#A9A7C8; --line:#2B2C4D; --marker:#6E5B10; --sent:rgba(255,214,64,.03); --wordhl:#EEC65B; --wordink:#141B33;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --brand:#A48EF7; --accent:#8C72F0; --paper:#0E1022; --surface:#181A36; --ink:#ECEBF7; --muted:#A9A7C8; --line:#2B2C4D; --marker:#6E5B10; --sent:rgba(255,214,64,.03); --wordhl:#EEC65B; --wordink:#141B33;
  --shadow:none;
}
:root{--r-sm:10px;--r-md:14px;--r-lg:20px;--tint:color-mix(in srgb,var(--lv,var(--accent)) 13%,transparent)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 80px}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- Teacher ---------- */
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;
  background:conic-gradient(from 200deg,var(--A1),var(--A2),var(--B1),var(--B2),var(--C1),var(--A1));color:#fff}
.brand h1{font-family:var(--read);font-size:2rem;line-height:1.1;margin:0}
.lead{color:var(--muted);margin:10px 0 22px;max-width:52ch}
.levels{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 16px;scrollbar-width:none}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lv);margin-right:6px;vertical-align:1px}
.list{display:grid;gap:12px}
.lvgrid{display:grid;gap:10px;margin-top:6px}
.item h2 .num{display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;margin-right:.5em;padding:0 .35em;border-radius:999px;background:var(--tint);color:var(--lv);font-family:var(--ui);font-size:.72em;font-weight:800;vertical-align:.12em}
.lvcard{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);transition:transform .12s ease}
.lvcard:active{transform:scale(.98)}
.lvbig{width:54px;height:54px;flex:none;border-radius:16px;background:var(--lv);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.15rem;letter-spacing:.02em;box-shadow:0 6px 14px color-mix(in srgb,var(--lv) 35%,transparent)}
.lvtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lvtxt b{font-family:var(--read);font-size:1.12rem}
.lvtxt small{color:var(--muted);font-size:.82rem;line-height:1.35}
.lvn{display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:1.1rem;line-height:1.1;color:var(--ink)}
.lvn small{font-weight:500;font-size:.7rem;color:var(--muted)}
.lvcard>svg{width:20px;height:20px;color:var(--muted);flex:none}
.lvgrid.rise .lvcard{animation:rise .38s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d)*45ms)}
.lvhead{display:flex;align-items:center;gap:14px;margin:12px 0 16px}
.lvhead h2{font-family:var(--read);font-size:1.5rem;margin:0}
.lvhead p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 16px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.item::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--lv)}
.item h2{font-family:var(--read);font-size:1.22rem;line-height:1.25;margin:0 0 6px}
.meta .has-voice{display:inline-flex;align-items:center;gap:4px}
.meta .has-voice svg{width:14px;height:14px}
.meta{color:var(--muted);font-size:.9rem;margin:0 0 14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.lv{display:inline-block;background:var(--lv);color:#fff;font-weight:700;font-size:.78rem;border-radius:6px;padding:2px 8px}
.actions{display:flex;gap:8px}
.btn{border:0;border-radius:var(--r-sm);min-height:44px;padding:0 16px;font-weight:600;font-size:.95rem;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.btn svg{width:18px;height:18px;flex:none}
.btn-main{background:var(--ink);color:var(--paper);flex:1}
.btn-ghost{background:transparent;border:1.5px solid var(--line)}
.ibtn{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;padding:0}
.ibtn svg{width:20px;height:20px}
.ibtn:hover{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}

.outs{margin-left:auto;display:flex;gap:6px}
.out{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:.85rem;color:var(--muted)}
.lock{position:relative;max-width:340px;margin:12vh auto 0;text-align:center}
.room{position:absolute;left:0;right:0;top:0;height:min(56vh,440px);background:url(room.jpg) 58% 45%/cover no-repeat;pointer-events:none;
  -webkit-mask-image:linear-gradient(#000 0%,rgba(0,0,0,.85) 45%,transparent 100%);mask-image:linear-gradient(#000 0%,rgba(0,0,0,.85) 45%,transparent 100%)}
.room::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(14,16,34,.35),rgba(14,16,34,.15) 40%,var(--paper))}
.room+.lock{margin-top:min(30vh,250px)}
.room+.lock .mark.big{box-shadow:0 18px 50px rgba(20,16,60,.45);border-radius:22%}
.motto{margin:26px 0 0;font-family:var(--read);font-style:italic;color:var(--brand);font-size:1.05rem;opacity:.9}
.motto::before{content:"";display:inline-block;width:34px;height:1px;background:currentColor;vertical-align:middle;margin-right:10px;opacity:.6}
.lock .logo{margin:0 auto 14px;width:56px;height:56px;font-size:1.6rem}
.lock h1{font-family:var(--read);font-size:2rem;margin:0}
.lock .lead{margin:6px auto 26px}
.lock form{text-align:left;display:grid;gap:6px}
.pin{font:inherit;font-size:1.5rem;letter-spacing:.4em;text-align:center;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.err{color:var(--bad);min-height:1.4em;margin:2px 0 6px;font-size:.9rem}
.lock .btn-main{min-height:50px}
.lock .lead{display:flex;align-items:center;justify-content:center;gap:6px}
.lock .lead svg{width:16px;height:16px}

.mark{display:block;border-radius:22%;flex:none}
.brand .tag,.lock .tag{margin:3px 0 0;color:var(--brand);font-family:var(--ui);font-weight:600;font-size:.72rem;letter-spacing:.24em;text-transform:uppercase}
.brand h1{font-size:1.3rem;white-space:nowrap}
.brand .tag{font-size:.6rem;letter-spacing:.2em;white-space:nowrap}
.brand>div:not(.outs){min-width:0}
.brand .mark{width:44px!important;height:44px!important}
.outs{margin-left:auto;display:flex;gap:8px;flex:none}
.outs .out{width:40px;height:40px;padding:0;display:grid;place-items:center;font-family:var(--read);font-weight:700;color:var(--ink)}
.outs .out svg{width:18px;height:18px}
.lock .mark.big{margin:0 auto 16px;width:84px;height:84px}
.lock .lead{margin-top:18px}
.sbrand{display:flex;align-items:center;gap:10px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.sbrand b{display:block;font-family:var(--read);font-size:1rem;line-height:1.2}
.sbrand span{color:var(--brand);font-size:.58rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase}

.w{border-radius:3px;cursor:pointer;touch-action:manipulation}
.w{transition:background-color .14s ease,box-shadow .14s ease,color .14s ease}
.w.wnow{background-color:var(--wordhl);box-shadow:0 0 0 .14em var(--wordhl);border-radius:.3em;color:var(--wordink,inherit)}
@media (prefers-reduced-motion:reduce){.w{transition:none}}
.w.sel{background:color-mix(in srgb,var(--accent) 24%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 50%,transparent)}
@media (hover:hover){.w:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}}
.wcard{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0 auto;max-width:560px;min-height:190px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(10,15,30,.25);padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .22s ease}
.wcard.show{transform:none}
.wc-x{position:absolute;right:8px;top:8px}
.wc-word{display:flex;align-items:center;gap:8px;padding-right:44px;font-family:var(--read);font-size:1.5rem}
.wc-tr{margin:6px 0 4px;min-height:2.3em}
.tr-arm{display:block;font-size:1.4rem;font-weight:600}
.tr-note{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.tr-fail{color:var(--muted);font-size:.92rem}
.wc-def{color:var(--muted);font-size:.9rem;min-height:1.3em;margin-bottom:10px}
.wc-act .btn{min-height:40px}
body.wc-open .wrap{padding-bottom:270px}

/* Share sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:20;opacity:0;transition:opacity .2s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:10px 20px calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;box-shadow:0 -10px 40px rgba(10,15,30,.18);
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:90vh;overflow:auto}
.sheet.show{transform:none}
.grab{width:36px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sh-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.sh-head>div{flex:1;min-width:0}
.sheet h3{font-family:var(--read);margin:0 0 6px;font-size:1.3rem;line-height:1.2}
.sheet .sub{color:var(--muted);font-size:.88rem;margin:0;display:flex;align-items:center;gap:8px}
.label{font-size:.85rem;font-weight:600;color:var(--muted);margin:18px 0 8px}
.sh-head+.label{margin-top:0}
.sheet>.sub+.label{margin-top:14px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:4px}
.tri{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px 14px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--paper);color:var(--ink);text-align:center}
.tri .tic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--ink);margin-bottom:2px}
.tri .tic svg{width:22px;height:22px}
.tri b{font-size:.98rem}
.tri small{color:var(--muted);font-size:.74rem;line-height:1.3}
.tri.main{background:var(--ink);color:var(--paper);border-color:var(--ink);box-shadow:0 8px 20px rgba(23,34,65,.22)}
.tri.main .tic{background:color-mix(in srgb,var(--paper) 16%,transparent);color:var(--paper)}
.tri.main small{color:inherit;opacity:.72}
.tri:disabled{opacity:.45;cursor:not-allowed}
.apps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:0 0 18px}
.app{border:0;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:7px;font-size:.74rem;font-weight:500;padding:4px 0;text-decoration:none}
.app i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;box-shadow:0 3px 10px rgba(10,15,30,.12)}
.app svg{width:25px;height:25px;fill:#fff}
.sheet-foot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.acts{border:1.5px solid var(--line);border-radius:var(--r-md);overflow:hidden}

/* read-aloud mode */
.ra-entry{width:100%;display:flex;align-items:center;gap:12px;margin-top:12px;padding:10px 12px;border-radius:var(--r-md);border:1px solid color-mix(in srgb,var(--lv) 35%,var(--line));background:color-mix(in srgb,var(--lv) 7%,var(--surface));color:var(--ink);font:inherit;text-align:left;transition:transform .12s ease}
.ra-entry:active{transform:scale(.985)}
.ra-ei{width:38px;height:38px;flex:none;border-radius:11px;background:var(--lv);color:#fff;display:grid;place-items:center}
.ra-ei svg{width:20px;height:20px}
.ra-et{flex:1;min-width:0;display:flex;flex-direction:column}
.ra-et b{font-size:.98rem}
.ra-et small{color:var(--muted);font-size:.8rem}
.ra-entry>svg{width:20px;height:20px;color:var(--muted);flex:none}
body.ra-open{overflow:hidden}
.ra{position:fixed;inset:0;z-index:45;background:var(--paper);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px calc(env(safe-area-inset-bottom,0px) + 16px);opacity:0;transform:translateY(16px);transition:opacity .25s ease,transform .32s cubic-bezier(.2,.8,.2,1)}
.ra.show{opacity:1;transform:none}
.ra-top{display:flex;align-items:center;gap:12px;max-width:640px;width:100%;margin:0 auto}
.ra-ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;flex:none}
.ra-ib svg{width:20px;height:20px}
.ra-ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.ra-ttl b{font-size:1.02rem}
.ra-ttl small{color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ra-n{font-weight:800;font-variant-numeric:tabular-nums;color:var(--lv);font-size:.95rem}
.ra-bar{display:flex;gap:4px;max-width:640px;width:100%;margin:14px auto 0}
.ra-bar i{flex:1;height:5px;border-radius:5px;background:var(--line);transition:background-color .3s ease}
.ra-bar i.done{background:color-mix(in srgb,var(--lv) 55%,var(--line))}
.ra-bar i.now{background:var(--lv)}
.ra-stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:640px;width:100%;margin:0 auto;overflow:auto;padding:18px 2px}
.ra-stage.swap .ra-cur{animation:raIn .38s cubic-bezier(.2,.8,.2,1)}
@keyframes raIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ra-prev,.ra-next{font-family:var(--read);font-size:1rem;line-height:1.55;color:var(--muted);opacity:.55;margin:0}
.ra-prev{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ra-next{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ra-cur{font-family:var(--read);font-size:clamp(1.45rem,6.2vw,2rem);line-height:1.5;margin:0;color:var(--ink);padding:18px 20px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-left:5px solid var(--lv)}
.ra .w{cursor:default}
.ra-hint{text-align:center;color:var(--muted);font-size:.88rem;margin:0 auto 12px;max-width:640px}
.ra-tools{display:flex;justify-content:center;gap:12px;max-width:640px;width:100%;margin:0 auto 14px}
.ra-tool{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:.86rem;transition:transform .12s ease,background-color .2s ease,border-color .2s ease,color .2s ease}
.ra-tool svg{width:24px;height:24px;color:var(--lv)}
.ra-tool:active:not(:disabled){transform:scale(.96)}
.ra-tool:disabled{opacity:.4}
.ra-tool.on{border-color:var(--lv);background:color-mix(in srgb,var(--lv) 12%,var(--surface))}
.ra-tool.rec.on{border-color:#D64545;background:color-mix(in srgb,#D64545 12%,var(--surface));color:#D64545}
.ra-tool.rec.on svg{color:#D64545;animation:raPulse 1.1s ease-in-out infinite}
@keyframes raPulse{50%{transform:scale(1.15);opacity:.7}}
.ra-tool.pop{animation:raPop .45s ease}
@keyframes raPop{40%{transform:scale(1.08)}}
.ra-nav{display:flex;gap:10px;max-width:640px;width:100%;margin:0 auto}
.ra-nav .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.ra-nav .btn svg{width:18px;height:18px}
.ra-nav .btn-main{flex:1.6}
.ra-done{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px;animation:raIn .4s cubic-bezier(.2,.8,.2,1)}
.ra-done[hidden]{display:none}
.ra-done h2{font-family:var(--read);font-size:1.7rem;margin:6px 0 0}
.ra-done p{color:var(--muted);margin:0 0 18px;max-width:340px}
.ra-badge{width:76px;height:76px;border-radius:50%;background:var(--lv);color:#fff;display:grid;place-items:center;box-shadow:0 12px 30px color-mix(in srgb,var(--lv) 40%,transparent)}
.ra-badge svg{width:38px;height:38px;stroke-width:2.6}
@media (prefers-reduced-motion:reduce){.ra,.ra-stage.swap .ra-cur,.ra-done,.ra-tool.rec.on svg{animation:none;transition:none}}
.qrv{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:18px;background:rgba(10,14,30,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .25s ease}
.qrv.show{opacity:1}
.qrbox{width:min(420px,100%);display:flex;flex-direction:column;gap:12px;transform:translateY(14px) scale(.98);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.qrv.show .qrbox{transform:none}
.qrcard{aspect-ratio:1080/1350;border-radius:var(--r-lg);overflow:hidden;background:#0E1022;display:grid;place-items:center;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.qrcv{width:100%;height:100%;display:block}
.qrload svg{width:46px;height:46px;color:#A9B3CE;animation:qrp 1.1s ease-in-out infinite}
@keyframes qrp{50%{opacity:.35}}
.qrerr{color:#fff;padding:24px;text-align:center}
.qrbtns{display:flex;gap:10px}
.qrbtns .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px}
.qrbtns .btn svg{width:20px;height:20px}
@media (prefers-reduced-motion:reduce){.qrv,.qrbox{transition:none}.qrload svg{animation:none}}

<script>

const TEACHER_NAME = "Gayane Torosyan";          // e.g. "Ms. Anna" — appears in the message if filled
const AUDIO_DIR = "audio/";       // MP3 files made by make_audio.py
// Teacher PIN (default 1234). To change: echo -n YOUR_PIN | sha256sum  → paste the result here
const TEACHER_PIN_HASH = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";

// Optional: an email raises the free translation limit from 5,000 to 50,000 characters per day.
// Use a separate, throw-away email (it is visible in the page's network requests), not a personal one.
let ESSAYS = window.ESSAYS || [];
/* ---- on-demand data: the page loads only what it shows ---- */
const scriptP={};
function loadScript(src){
  return scriptP[src]||(scriptP[src]=new Promise((res,rej)=>{
    const el=document.createElement("script"); el.src=src;
    el.onload=()=>res(); el.onerror=()=>{ delete scriptP[src]; el.remove(); rej(new Error(src)); };
    document.head.appendChild(el);
  }));
}
const safeId=id=>/^[a-z0-9-]{1,60}$/.test(id||"");
async function loadPart(id){             // one lesson / exercise / test, built by build_pages.py
  const P=()=>(window.PARTS||{})[id];
  if(P()) return P();
  if(!safeId(id)) return null;
  try{ await loadScript("p/"+id+".js"); }catch{ return null; }
  return P()||null;
}
function loadEssays(){ return window.ESSAYS&&window.ESSAYS.length?Promise.resolve(ESSAYS=window.ESSAYS):loadScript("essays.js").then(()=>ESSAYS=window.ESSAYS||[]); }
function loadDict(){ return window.DICT?Promise.resolve(window.DICT):loadScript("dict.js").then(()=>window.DICT||{}); }
async function getEssay(id){
  if(!id) return null;
  if(ESSAYS.length) return ESSAYS.find(x=>x.id===id)||null;
  const part=await loadPart(id);
  if(part&&part.e) return part.e;
  try{ await loadEssays(); }catch{ return null; }
  return ESSAYS.find(x=>x.id===id)||null;
}
const LOADING=`<div class="gload" aria-busy="true">${"<span></span>".repeat(3)}</div>`;
const LOGO_INNER = `<rect width="512" height="512" rx="116" fill="#17183A"/><rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="3"/><g transform="translate(84.5 74) scale(.67)"><g><path class="st" style="--i:0" d="M10 150 L40 164 L40 336 C112 344 196 372 252 446 L252 470 C190 404 108 382 10 376 Z" fill="#6A49E2"/>
<path class="st" style="--i:2" d="M88 54 C162 62 222 98 250 158 L252 222 C226 166 170 128 88 116 Z" fill="#9378F2" stroke="#17183A" stroke-width="12" paint-order="stroke"/>
<path class="st" style="--i:1" d="M60 124 C134 130 204 164 240 222 L252 428 C210 370 140 334 60 318 Z" fill="#A891F7" stroke="#17183A" stroke-width="14" paint-order="stroke"/></g><g transform="translate(512 0) scale(-1 1)"><path class="st" style="--i:0" d="M10 150 L40 164 L40 336 C112 344 196 372 252 446 L252 470 C190 404 108 382 10 376 Z" fill="#5B3DD8"/>
<path class="st" style="--i:2" d="M88 54 C162 62 222 98 250 158 L252 222 C226 166 170 128 88 116 Z" fill="#7B5DEB" stroke="#17183A" stroke-width="12" paint-order="stroke"/>
<path class="st" style="--i:1" d="M60 124 C134 130 204 164 240 222 L252 428 C210 370 140 334 60 318 Z" fill="#8C70F2" stroke="#17183A" stroke-width="14" paint-order="stroke"/></g></g>`;
const logoMark = (size, cls="") => `<span class="mark ${cls}" style="width:${size}px;height:${size}px" aria-hidden="true"><svg viewBox="0 0 512 512">${LOGO_INNER}</svg></span>`;
const REDUCED = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
let chimeEl=null;
function chime(){ try{ chimeEl=chimeEl||new Audio("brand/chime.mp3"); chimeEl.volume=.6; chimeEl.currentTime=0; chimeEl.play().catch(()=>{}); }catch{} }
const LEVELS = ["A1","A2","B1","B2","C1"];
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wordCount = e => e.text.join(" ").split(/\s+/).length;
const WPM = {A1:70, A2:85, B1:100, B2:115, C1:125};          // calm learner reading speed
const readMins = e => Math.max(1, Math.round(wordCount(e) / (WPM[e.level] || 100)));
const baseUrl = () => location.origin + location.pathname;
const dirUrl = () => location.origin + location.pathname.replace(/[^/]*$/, "");
const linkFor = e => dirUrl() + "l/" + e.id + ".html";   // branded preview page (built by build_pages.py)
const isPhone = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

/* audio availability cache */
const audioOK = {};
async function hasAudio(id){
  if(id in audioOK) return audioOK[id];
  if(location.protocol==="file:") return audioOK[id]=false;
  try{ const r=await fetch(AUDIO_DIR+id+".mp3",{method:"HEAD"}); audioOK[id]=r.ok; }
  catch{ audioOK[id]=false; }
  return audioOK[id];
}

function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),2600);
}
async function copy(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch{
    const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); let ok=false; try{ok=document.execCommand("copy")}catch{} ta.remove(); return ok;
  }
}

function route(){
  closeSheet(true); stopAll(); closeWordCard();
  const sp=new URLSearchParams(location.search), id=sp.get("e");
  gramSeq++; G_=null; X_=null; clearTimeout(gRender.t); app.style.removeProperty("--lv");
  if(id){
    const seq=gramSeq, known=ESSAYS.find(x=>x.id===id);
    if(known) student(known);
    else{ app.innerHTML=LOADING; getEssay(id).then(e=>{ if(seq!==gramSeq) return; e?student(e):teacher(); window.scrollTo(0,0); }); }
  }
  else if(sp.has("g")) gramStudent(sp.get("g"));
  else if(sp.has("gl")) teacherGrammar();
  else if(sp.has("t")) examStudent(sp.get("t"));
  else if(sp.has("tl")) teacherExams();
  else if(sp.has("b")) bankStudent(sp.get("b"));
  else if(sp.has("bl")) teacherBank(sp.get("bl"));
  else teacher();
  window.scrollTo(0,0);
}
function go(url){ history.pushState(null,"",url); route(); }

/* ================= Lock ================= */
const LS_KEY="reading-room-teacher";
async function sha256(t){
  if(!(window.crypto&&crypto.subtle)) return null;
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function isTeacher(){ try{ return localStorage.getItem(LS_KEY)===TEACHER_PIN_HASH; }catch{ return sessionOK; } }
let sessionOK=false;
function lockScreen(){
  document.title="Gayane Torosyan | English Reading Room";
  app.innerHTML=`
  <div class="room" aria-hidden="true"></div>
  <section class="lock">
    ${logoMark(84,"big anim")}
    <h1>Gayane Torosyan</h1>
    <p class="tag">English Reading Room</p>
    <p class="lead">${ICO.lock}Մուտք միայն ուսուցչի համար</p>
    <form id="lockForm" autocomplete="off">
      <label for="pin" class="label">PIN կոդ</label>
      <input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
      <p class="err" id="err" aria-live="polite"></p>
      <button class="btn btn-main" type="submit">Մուտք</button>
    </form>
    <p class="motto">Let’s read together</p>
  </section>`;
  const pin=document.getElementById("pin"); pin.focus();
  setTimeout(()=>loadEssays().catch(()=>{}),400);      // ready by the time the PIN is typed
  document.getElementById("lockForm").onsubmit=async ev=>{
    ev.preventDefault();
    const h=await sha256(pin.value.trim());
    const err=document.getElementById("err");
    if(!err||!pin.isConnected) return;       // the page changed while checking
    if(h===TEACHER_PIN_HASH){
      sessionOK=true; try{ localStorage.setItem(LS_KEY,h); }catch{}
      teacher();
    }else{
      err.textContent= h===null
        ? "Բացիր կայքը https:// հասցեով (օր.՝ GitHub Pages-ով)"
        : "Սխալ PIN, փորձիր նորից";
      pin.value=""; pin.focus();
    }
  };
}
function logout(){ sessionOK=false; try{ localStorage.removeItem(LS_KEY); }catch{} lockScreen(); }

/* ================= Teacher ================= */

  C1:["Առաջադեմ","Ակադեմիական տեքստեր, քննադատական մտածողություն"]

    const seq=gramSeq; app.innerHTML=LOADING;

    app.querySelectorAll("[data-lv]").forEach(a=>a.onclick=ev=>{ ev.preventDefault(); go("?lv="+a.dataset.lv); });
    byId("gramCard").onclick=ev=>{ ev.preventDefault(); go("?gl"); };
    byId("examCard").onclick=ev=>{ ev.preventDefault(); go("?tl"); };
    byId("bankCard").onclick=ev=>{ ev.preventDefault(); go("?bl"); };
  }else{
    const shown=ESSAYS.filter(e=>e.level===lv);
    app.innerHTML=head+`
  <a class="back" href="./" id="lvBack">${ICO.chevL}Մակարդակներ</a>
  <div class="lvhead" style="--lv:var(--${lv})"><span class="lvbig">${lv}</span><div><h2>${LEVEL_INFO[lv][0]}</h2><p>${shown.length} դաս · ${LEVEL_INFO[lv][1]}</p></div></div>
  <section class="list rise">
    ${shown.map((e,i)=>`
    <article class="item" style="--lv:var(--${e.level});--d:${Math.min(i,10)}">
      <h2><span class="num">${i+1}</span>${esc(e.title)}</h2>
      <p class="meta"><span class="lv">${e.level}</span><span>${esc(e.topic)}</span><span>~${readMins(e)} րոպե</span><span>${e.qs.length} հարց</span><span data-audio="${e.id}"></span></p>
      <div class="actions">
        <button class="btn btn-main" data-share="${e.id}">Ուղարկել</button>
        <a class="btn btn-ghost" href="?e=${e.id}" data-go="${e.id}">Դիտել</a>
      </div>

    byId("lvBack").onclick=ev=>{ ev.preventDefault(); go(baseUrl()); };
    app.querySelectorAll("[data-go]").forEach(a=>a.onclick=ev=>{ev.preventDefault();go("?e="+a.dataset.go)});
    app.querySelectorAll("[data-share]").forEach(b=>b.onclick=()=>openSheet(ESSAYS.find(x=>x.id===b.dataset.share)));
    shown.forEach(async e=>{ if(await hasAudio(e.id)){ const s=app.querySelector(`[data-audio="${e.id}"]`); if(s){ s.className="has-voice"; s.innerHTML=ICO.headphones+"ձայն"; } }});
  }

  bindThemeBtn("hy");

/* ---- message texts ---- */
const BRAND = "📘 Gayane Torosyan | English Reading Room";
function message(e){
  return `${BRAND}\n\n📖 ${e.title}\nLevel ${e.level} · ~${readMins(e)} min · ${e.qs.length} questions\n\nRead, listen and answer 👇\n${linkFor(e)}`;
}
function fullLesson(e){
  const lines=[BRAND,"━━━━━━━━━━━━━━━━",`📖 ${e.title} (${e.level})`,"",...e.text.flatMap(p=>[p,""]),
    "📝 New words:",...e.words.map(w=>`• ${w[0]} — ${w[1]}`),"",
    "❓ Questions:",...e.qs.map((q,i)=>`${i+1}. ${q[0]}\n   ${q[1].slice().sort().map((o,j)=>String.fromCharCode(97+j)+") "+o).join("   ")}`),"",
    "━━━━━━━━━━━━━━━━",`🎧 Listen and check your answers: ${linkFor(e)}`,`— ${TEACHER_NAME}, English teacher`];
  return lines.join("\n");
}

/* ---- day / night: one button; follows the phone until the user chooses ---- */
const PREF_KEY="reading-room-prefs";
let themePref=null;                         // null = follow the phone, or "light" / "dark"
function loadPrefs(){
  try{ const j=JSON.parse(localStorage.getItem(PREF_KEY)||"{}"); if(j&&(j.theme==="light"||j.theme==="dark")) themePref=j.theme; }catch{}
}
function savePrefs(){ try{ localStorage.setItem(PREF_KEY,JSON.stringify({theme:themePref})); }catch{} }
function systemDark(){ try{ return matchMedia("(prefers-color-scheme: dark)").matches; }catch{ return false; } }
function isDark(){ return themePref?themePref==="dark":systemDark(); }
function applyPrefs(){
  const r=document.documentElement, dark=isDark();
  r.dataset.theme=dark?"dark":"light"; r.dataset.mode=dark?"dark":"light";
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content",dark?"#0E1022":"#F6F5FB");
  const b=byId("themeBtn"); if(b) labelThemeBtn(b);
  if(!waveRAF&&byId("wave")) waveDraw();
}
function labelThemeBtn(b){
  const dark=isDark(), hy=b.dataset.lang==="hy";
  b.setAttribute("aria-pressed",String(dark));
  const t=hy?(dark?"Ցերեկային ռեժիմ":"Գիշերային ռեժիմ"):(dark?"Day mode":"Night mode");
  b.setAttribute("aria-label",t); b.title=t;
}
let themeAnimT=0;
function toggleTheme(){
  const r=document.documentElement;
  if(!REDUCED()){ r.classList.add("theme-anim"); clearTimeout(themeAnimT); themeAnimT=setTimeout(()=>r.classList.remove("theme-anim"),450); }
  themePref=isDark()?"light":"dark"; savePrefs(); applyPrefs();
}
function bindThemeBtn(lang){ const b=byId("themeBtn"); if(!b) return; b.dataset.lang=lang; b.onclick=toggleTheme; labelThemeBtn(b); }
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(!themePref) applyPrefs(); }); }catch{}

  if(!wordStart.length) return;

  setWord(k>=0&&t<=wordEnd[k]+0.35?wordIdx[k]:-1);
}

/* ---- tap a word: translation ---- */
const normWord=w=>w.toLowerCase().replace(/[’]/g,"'").replace(/'s$/,"").replace(/^['-]+|['-]+$/g,"");
function buildKeys(e){
  const m=new Map();
  (e.words||[]).forEach(p=>{
    const en=String(p[0]), hy=String(p[1]);
    const base=en.replace(/\s*\(.*?\)/g,"").trim(), par=(en.match(/\(([^)]*)\)/)||[])[1];
    [base,par].forEach(h=>{ if(h&&!/\s/.test(h)) m.set(normWord(h),hy); });
  });
  return m;
}
function lookupCurated(w){
  if(keyWords.has(w)) return keyWords.get(w);
  const stem=w.replace(/(ing|ed|es|s|ly|d)$/,"");
  for(const s of [stem,stem+"e"]) if(s.length>2&&keyWords.has(s)) return keyWords.get(s);
  return null;
}
function wordify(s){
  return s.replace(/([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ'’-]*)|([^A-Za-zÀ-ÿ]+)/g,(m,w,o)=>{
    if(!w) return esc(o);
    const n=normWord(w); if(!n) return esc(w);
    return `<span class="w${lookupCurated(n)?" key":""}" data-w="${esc(n)}">${esc(w)}</span>`;
  });
}
async function fetchJson(url,ms=7000){
  const c=typeof AbortController!=="undefined"?new AbortController():null;
  const t=c?setTimeout(()=>c.abort(),ms):0;
  try{ const r=await fetch(url,c?{signal:c.signal}:undefined); if(!r||!r.ok) throw new Error("http"); return await r.json(); }
  finally{ clearTimeout(t); }
}
/* every word of every lesson has a checked Armenian translation in dict.js */
try{ localStorage.removeItem("reading-room-translations"); }catch{}
function dictLookup(w){
  const D=window.DICT||{};
  if(typeof D[w]==="string") return D[w];
  if(w.includes("-")){                          // rare compounds: translate the parts
    const parts=w.split("-").filter(Boolean), t=parts.map(p=>D[p]);
    if(parts.length>1&&t.every(x=>typeof x==="string")) return t.map(x=>x.split(/[;,(]/)[0].trim()).join(" + ");
  }
  return null;
}
const defMem=new Map();
async function defineWord(w){
  if(defMem.has(w)) return defMem.get(w);

  let out=null;
  const m=Array.isArray(d)&&d[0]&&Array.isArray(d[0].meanings)?d[0].meanings[0]:null;

/* ---- live waveform: bars follow the real loudness of the recording ---- */
let envArr=null, envHop=0.05, waveRAF=0, waveT=0, waveScrub=null, waveCols=null, waveFrame=0, waveBound=false;
function parseEnv(j){
  envArr=null;
  if(!j||Array.isArray(j)) return;
  const a=j.env, h=+j.hop;
  if(Array.isArray(a)&&a.length>10&&a.length<40000&&h>0.005&&h<=1&&a.every(x=>typeof x==="number"&&isFinite(x))){
    envArr=Float32Array.from(a,x=>Math.max(0,Math.min(1,x/100))); envHop=h;
  }
}
function envAt(t,dur){                     // loudest moment (0..1) inside [t, t+dur)
  if(!envArr||!(t>=0)) return 0;
  const a=Math.floor(t/envHop), b=Math.max(a+1,Math.ceil((t+dur)/envHop));
  let m=0; for(let i=a;i<b&&i<envArr.length;i++) if(envArr[i]>m) m=envArr[i];
  return m;
}
function simAmp(t){                        // stand-in rhythm when no measured loudness exists
  return Math.pow(Math.abs(Math.sin(t*7.3)*Math.sin(t*2.9+1.3)*Math.sin(t*12.1+.4)),.7)*.9;
}
function waveColors(){
  const cs=getComputedStyle(app), g=n=>cs.getPropertyValue(n).trim();
  return {played:g("--lv")||"#3E5FD9", rest:g("--muted")||"#5A6583", ink:g("--ink")||"#172241"};
}
function rbar(ctx,x,y,w,h){
  const r=Math.min(w/2,h/2);
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill();
}
function waveDraw(){
  const cv=byId("wave"); if(!cv) return;
  let ctx=null; try{ ctx=cv.getContext&&cv.getContext("2d"); }catch{}
  if(!ctx) return;
  const dpr=Math.min(3,window.devicePixelRatio||1), w=cv.clientWidth||320, h=cv.clientHeight||72;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  if(!waveRAF||waveFrame%40===0) waveCols=waveColors();
  waveFrame++;
  let t=waveScrub!=null?waveScrub:(audioEl?audioEl.currentTime:0);
  if(!isFinite(t)||t<0) t=0;
  if(Math.abs(t-waveT)>0.3||!playing) waveT=t; else waveT+=(t-waveT)*0.4;      // smooth scrolling
  const pitch=6, bw=3.2, barDur=0.11, cx=w/2, mid=h/2, maxH=h-6, half=Math.ceil(cx/pitch)+1;
  const pos=waveT/barDur, base=Math.floor(pos), off=(pos-base)*pitch, now=performance.now()/1000;
  for(let k=-half;k<=half;k++){
    const bi=base+k, bt=bi*barDur, x=cx+k*pitch-off;
    let a;
    if(envArr) a=envAt(bt,barDur);
    else if(playing) a=simAmp(audioEl?bt:now+k*0.13);
    else a=0;
    const fade=Math.max(0,Math.min(1,(cx-Math.abs(x-cx))/(w*0.2)+0.15));       // soft edges
    const done=bt+barDur<=waveT, centre=k===0;
    ctx.fillStyle=centre?waveCols.ink:(done?waveCols.played:waveCols.rest);
    ctx.globalAlpha=(centre?1:(done?0.95:0.4))*fade;
    if(a<0.05){ ctx.beginPath(); ctx.arc(x,mid,1.6,0,6.2832); ctx.fill(); }      // quiet = a dot
    else{ const hh=Math.max(5,Math.pow(a,0.75)*maxH*(centre?1.06:1)); rbar(ctx,x-bw/2,mid-hh/2,bw,hh); }
  }
  ctx.globalAlpha=1;
}
function waveKick(){
  if(typeof cancelAnimationFrame==="function") cancelAnimationFrame(waveRAF);
  waveRAF=0;
  if(!byId("wave")) return;
  if(!playing||REDUCED()||typeof requestAnimationFrame!=="function"){ waveDraw(); return; }
  const step=()=>{
    if(!byId("wave")||!playing){ waveRAF=0; waveDraw(); return; }
    if(audioEl) wordTick(audioEl.currentTime||0);
    const m=byId("mini"); if(!document.hidden&&!(m&&m.classList.contains("show"))) waveDraw();
    waveRAF=requestAnimationFrame(step);
  };
  waveRAF=requestAnimationFrame(step);
}

/* ---- player (YouTube-style) ---- */
async function setupPlayer(e){
  const myRoute=++token;
  const mp3=await hasAudio(e.id);
  if(myRoute!==token) return;
  if(mp3){
    const a=new Audio(AUDIO_DIR+e.id+".mp3"); a.preload="metadata"; a.playbackRate=rate;
    let st=null, sp=null, jj=null;
    try{
      const r=await fetch(AUDIO_DIR+e.id+".json");
      if(r.ok){
        const j=await r.json(); jj=j;
        const list=Array.isArray(j)?j:(j&&j.starts)||[];
        if(!Array.isArray(j)&&j&&j.end>j.start) sp={start:+j.start,end:+j.end};
        if(Array.isArray(list)&&list.length===sentences.length&&list.every(x=>typeof x==="number"&&isFinite(x))) st=list;
      }
    }catch{}
    if(myRoute!==token) return;
    audioEl=a; starts=st; span=sp; parseEnv(jj); setupWords(jj&&!Array.isArray(jj)?jj.words:null);
    a.onloadedmetadata=setupSeek; a.ondurationchange=setupSeek;
    a.ontimeupdate=onTime;
    a.onended=()=>{ playing=false; mark(-1); setWord(-1); setBtn(); updateSeek(); };
    setupMediaSession(e);
  }else if(!("speechSynthesis" in window)){
    byId("noaudio").hidden=false; return;
  }else pickVoice();
  if(!byId("player")) return;
  playerReady=true;
  if(!waveBound){ waveBound=true; window.addEventListener("resize",()=>{ if(!waveRAF) waveDraw(); }); }
  waveDraw();
  byId("player").hidden=false; byId("hint").hidden=false; byId("hint2").hidden=true;
  if(miniIO){ miniIO.disconnect(); miniIO=null; }
  if("IntersectionObserver" in window){      // slim player at the top once the big one scrolls away
    miniIO=new IntersectionObserver(list=>{ const en=list[list.length-1], m=byId("mini"); if(m) m.classList.toggle("show",!en.isIntersecting&&en.boundingClientRect.top<0); },{threshold:0});
    miniIO.observe(byId("player"));
  }
  if(!audioEl){ byId("back10").hidden=true; byId("fwd10").hidden=true; }
  setupSeek(); setBtn();
  const togglePlay=()=>playing?pause():playFrom(audioEl?null:cur);
  byId("play").onclick=togglePlay; byId("mplay").onclick=togglePlay;
  byId("prevS").onclick=()=>stepSentence(-1);
  byId("nextS").onclick=()=>stepSentence(1);
  byId("back10").onclick=()=>skipBy(-10);
  byId("fwd10").onclick=()=>skipBy(10);
  byId("speed").onclick=ev=>{
    rate=RATES[(RATES.indexOf(rate)+1)%RATES.length]; ev.currentTarget.textContent=`Speed ${rate}×`;
    if(audioEl){ audioEl.playbackRate=rate; msPos(true); } else if(playing) playFrom(cur);
  };
  byId("loop").onclick=ev=>{
    loopOn=!loopOn; ev.currentTarget.setAttribute("aria-pressed",String(loopOn)); ev.currentTarget.classList.toggle("on",loopOn);
    if(loopOn){ const i=curIndex(); if(i<0||i>=sentences.length){ gotoSentence(0); loopIdx=0; } else loopIdx=i; } else loopIdx=-1;
  };
  const wire=sk=>{
    if(!sk) return;
    sk.addEventListener("input",()=>{
      scrubbing=true; clearTimeout(scrubT); scrubT=setTimeout(()=>{scrubbing=false; waveScrub=null},1500);
      waveScrub=audioEl?+sk.value:null; if(!waveRAF) waveDraw();
      const v=+sk.value, max=+sk.max||1, pct=Math.min(100,v/max*100)+"%";
      const lab=audioEl?fmt(v):`${Math.round(v)+1}/${sentences.length}`;
      [["seek","tcur"],["mseek","mcur"]].forEach(([a,b])=>{ const s2=byId(a), t=byId(b); if(!s2) return; if(s2!==sk) s2.value=sk.value; s2.style.setProperty("--p",pct); if(t) t.textContent=lab; });
    });
    sk.addEventListener("change",()=>{
      clearTimeout(scrubT); scrubbing=false; waveScrub=null;
      const v=+sk.value; if(!isFinite(v)) return;
      if(audioEl){
        const d=audioEl.duration;
        seekAudio(Math.max(0,isFinite(d)&&d>0?Math.min(v,d-0.05):v));
        const i=sentenceAt(audioEl.currentTime,audioEl.duration||0); mark(i);
        if(loopOn&&i>=0) loopIdx=i;
      }else gotoSentence(Math.round(v));
      updateSeek();
    });
  };
  wire(byId("seek")); wire(byId("mseek"));
}

/* lock screen, notification and headphone controls (iPhone and Android) */
const MS_ACTIONS=["play","pause","stop","previoustrack","nexttrack","seekbackward","seekforward","seekto"];
let msLast=0;
function setupMediaSession(e){
  try{
    if(!("mediaSession" in navigator)||typeof MediaMetadata==="undefined") return;
    const ms=navigator.mediaSession, abs=u=>new URL(u,location.href).href;
    ms.metadata=new MediaMetadata({title:e.title,artist:"Gayane Torosyan",album:`English Reading Room · ${e.level}`,
      artwork:[{src:abs("icon-192.png"),sizes:"192x192",type:"image/png"},{src:abs("icon-512.png"),sizes:"512x512",type:"image/png"}]});
    const set=(n,f)=>{ try{ ms.setActionHandler(n,f); }catch{} };
    set("play",()=>playFrom(null)); set("pause",pause); set("stop",pause);
    set("previoustrack",()=>stepSentence(-1)); set("nexttrack",()=>stepSentence(1));
    set("seekbackward",d=>skipBy(-((d&&d.seekOffset)||10))); set("seekforward",d=>skipBy((d&&d.seekOffset)||10));
    set("seekto",d=>{ if(!audioEl||!d||!isFinite(d.seekTime)) return;
      seekAudio(Math.max(0,d.seekTime)); mark(sentenceAt(audioEl.currentTime,audioEl.duration||0)); updateSeek(); msPos(true); });
    msState();
  }catch{}
}
function msState(){ try{ if("mediaSession" in navigator) navigator.mediaSession.playbackState=audioEl?(playing?"playing":"paused"):"none"; }catch{} }
function msPos(force){

    const d=audioEl.duration; if(!(isFinite(d)&&d>0)) return;

  }catch{}
}

  }catch{}

function setupSeek(){
  const sk=byId("seek"); if(!sk) return;

  if(audioEl){
    const d=audioEl.duration;
    if(isFinite(d)&&d>0){ sk.max=String(d); sk.step="0.1"; durTxt=fmt(d); drawTicks(d); }
  }else{
    sk.min="0"; sk.max=String(Math.max(0,sentences.length-1)); sk.step="1"; durTxt="";
  }

  updateSeek();
}
function drawTicks(d){
  if(!(d>0)) return;
  const html=sentences.map((_,i)=>{ const x=timeOf(i)/d*100; return x>=0&&x<=100?`<i style="left:${x.toFixed(2)}%"></i>`:""; }).join("");
  ["ticks","mticks"].forEach(id=>{ const t=byId(id); if(t) t.innerHTML=html; });

function updateSeek(){

  if(audioEl){ v=audioEl.currentTime||0; lab=fmt(v); vt=`${fmt(v)} of ${fmt(max)}`; }
  else{ v=cur; lab=`${Math.min(cur+1,sentences.length)}/${sentences.length}`; vt=`sentence ${Math.min(cur+1,sentences.length)} of ${sentences.length}`; }

    const a=timeOf(loopIdx), b=loopIdx+1<sentences.length?timeOf(loopIdx+1):(span?span.end:d);

function playFrom(i){

  }

  const my=++token;
  const next=()=>{
    if(my!==token||!playing) return;
    if(cur>=sentences.length){playing=false;cur=0;mark(-1);setBtn();updateSeek();return}
    mark(cur); updateSeek();
    const u=utter(sentences[cur]);

function checkQuiz(e){
  let right=0, answered=0;
  e.qs.forEach((_,qi)=>{
    const inputs=[...app.querySelectorAll(`input[name=q${qi}]`)];
    const chosen=inputs.find(i=>i.checked);
    inputs.forEach(inp=>{ const l=inp.closest(".opt"); l.classList.remove("right","wrong","flash"); });
    if(!chosen) return;                       // unanswered: don't reveal the answer
    answered++;
    inputs.forEach(inp=>{
      const l=inp.closest(".opt");
      if(l.dataset.ok==="true") l.classList.add("right");
      if(inp===chosen&&l.dataset.ok!=="true") l.classList.add("wrong");
    });
    if(chosen.closest(".opt").dataset.ok==="true") right++;
    void app.offsetWidth;                     // restart the small animation on every check
    inputs.forEach(inp=>{ const l=inp.closest(".opt"); if(l.classList.contains("right")||l.classList.contains("wrong")) l.classList.add("flash"); });
  });
  const sc=document.getElementById("score"), n=e.qs.length, perfect=answered===n&&right===n;
  sc.classList.remove("win");
  if(answered<n){ sc.textContent=`You answered ${answered} of ${n}. Correct: ${right}. Answer all the questions.`; return; }
  const tail=perfect?" Excellent!":" Read it again and try once more!";
  if(REDUCED()){ sc.textContent=`You got ${right} of ${n}.${tail}`; }
  else{
    let k=0; sc.textContent=`You got 0 of ${n}.`;
    const step=()=>{ sc.textContent=`You got ${k} of ${n}.${k===right?tail:""}`; if(k<right){ k++; setTimeout(step,140); } };
    step();
  }
  if(perfect){ void sc.offsetWidth; sc.classList.add("win"); chime(); }
}

let gramP=null, gramSeq=0;
function loadGrammar(){
  if(window.GRAMMAR) return Promise.resolve(window.GRAMMAR);
  return gramP||(gramP=new Promise((res,rej)=>{
    const s=document.createElement("script"); s.src="grammar.js";
    s.onload=()=>res(window.GRAMMAR||[]); s.onerror=()=>{ gramP=null; s.remove(); rej(new Error("grammar")); };
    document.head.appendChild(s);
  }));
}
const GRAM=()=>window.GRAMMAR||[];
function gFind(id){ for(const s of GRAM()) for(const p of s.parts) if(p.id===id) return {s,p}; return null; }
const gIsFill=p=>!!(p.qs[0]&&p.qs[0].f);
const gObj=(s,p)=>({id:p.id, title:`${s.title} · ${p.title}`, level:p.level||"B1", topic:"Grammar"});
const gTypeHy=p=>gIsFill(p)?"Գրել ճիշտ ձևը":"Ընտրել ճիշտ տարբերակը";
const gTypeEn=p=>gIsFill(p)?"Write the correct form":"Choose the correct answer";
const L=i=>String.fromCharCode(65+i);
const BL=/_{3,}/g;
function gHintHTML(h){ const i=h.indexOf(" — "); return i<0?esc(h):`<b>${esc(h.slice(0,i))}</b> — ${esc(h.slice(i+3))}`; }

/* lenient checking for written answers */
function gCanon(s){
  s=String(s||"").toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g," ").trim().replace(/\s*[.!?,;:]+$/,"");
  s=s.replace(/\bwon't\b/g,"will not").replace(/\bshan't\b/g,"shall not").replace(/\bcan't\b/g,"cannot").replace(/\bcan not\b/g,"cannot")
     .replace(/n't\b/g," not").replace(/'ve\b/g," have").replace(/'ll\b/g," will").replace(/'m\b/g," am").replace(/'re\b/g," are");
  return s.replace(/\s+/g," ").trim();
}
function gCombos(f){ return f.reduce((acc,opts)=>acc.flatMap(a=>opts.map(o=>a?a+" "+o:o)),[""]); }
function gFillOK(q,ans){
  ans=ans||[];
  if(q.f.every((opts,i)=>opts.some(o=>gCanon(o)===gCanon(ans[i])))) return true;
  const joined=gCanon(ans.filter(x=>gCanon(x)).join(" "));
  return !!joined && gCombos(q.f).some(c=>gCanon(c)===joined);
}
const gAnswered=(q,a)=>q.f?Array.isArray(a)&&a.some(x=>gCanon(x)):Number.isInteger(a);
const gRight=(q,a)=>q.f?gFillOK(q,a):q.a.includes(a);

/* sentence with blanks: fill = parts to show in the blanks (or input boxes) */
function gSentence(q,fill,inputs){
  const parts=q.q.split(BL); let k=0;
  return parts.map((t,i)=>esc(t)+(i<parts.length-1?(()=>{ const j=k++;
    if(inputs) return `<input class="gin" data-b="${j}" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next" aria-label="Blank ${j+1}" value="${esc((fill&&fill[j])||"")}">`;
    return `<span class="gbl">${esc((fill&&fill[j])||"")}</span>`; })():"")).join("");
}
function gSplitOpt(q,o){ const n=(q.q.match(BL)||[]).length, bits=o.split(" / "); return bits.length===n?bits:[o]; }

let examP=null;
function loadExams(){
  if(window.EXAMS) return Promise.resolve(window.EXAMS);
  return examP||(examP=new Promise((res,rej)=>{
    const s=document.createElement("script"); s.src="exams.js";
    s.onload=()=>res(window.EXAMS||[]); s.onerror=()=>{ examP=null; s.remove(); rej(new Error("exams")); };
    document.head.appendChild(s);
  }));
}
const EXS=()=>window.EXAMS||[];
const xItems=t=>t.sections.flatMap(s=>s.groups.flatMap(g=>g.items.map(it=>({s,it}))));
const xRange=s=>{ const n=s.groups.flatMap(g=>g.items.map(i=>i.n)); return n.length>1?`${n[0]}–${n[n.length-1]}`:`${n[0]}`; };
const xObj=t=>({id:t.id, title:t.title, level:"B2", chip:"Unified exam format · 80 tasks", topic:"Test"});
function xMessage(t){ return `${BRAND}\n\n📝 ${t.title}\nUnified exam format · 80 tasks · 13 sections\n\nDo the test and see your score 👇\n${linkFor(t)}`; }
const xSame=(a,b)=>Array.isArray(a)&&a.length===b.length&&a.every((x,i)=>x===b[i]);
function xAnswered(s,v){
  if(s.type==="mc") return Number.isInteger(v);
  return Array.isArray(v)&&v.some(x=>x!=null&&x!=="");
}
function xRight(s,it,v){
  if(s.type==="mc") return v===it.a;
  if(s.type==="multi") return Array.isArray(v)&&xSame([...v].sort((a,b)=>a-b),[...it.a].sort((a,b)=>a-b));
  return xSame(v||[],it.a);
}

let X_=null;           // {t, sec, ans:{n:value}, done}
const xKey=id=>"rr-exam-"+id;
function xSave(){ if(!X_) return; try{ localStorage.setItem(xKey(X_.t.id),JSON.stringify({ans:X_.ans,sec:X_.sec})); }catch{} }
function xLoad(id){ try{ const j=JSON.parse(localStorage.getItem(xKey(id))||"null"); if(j&&j.ans&&typeof j.ans==="object") return j; }catch{} return null; }
async function examStudent(id){
  const seq=++gramSeq;
  app.innerHTML=LOADING;
  let t=window.EXAMS?EXS().find(x=>x.id===id):null;
  if(!t&&!window.EXAMS){ const part=await loadPart(id); if(part&&part.t&&part.t.sections) t=part.t; }
  if(!t&&!window.EXAMS){ try{ await loadExams(); t=EXS().find(x=>x.id===id); }catch{ if(seq===gramSeq) app.innerHTML=`<p class="gload">Could not load the test. Check the internet and reload the page.</p>`; return; } }

function xOpen(t,ctx){
  const sv=xLoad(t.id);
  X_={t, ctx, sec:sv?Math.min(Math.max(sv.sec|0,0),t.sections.length-1):0, ans:sv?sv.ans:{}};
  document.title=`${ctx.head} | Gayane Torosyan`;
  app.style.setProperty("--lv","var(--C1)");

}
function xShell(inner){
  const c=X_.ctx;
  return `<div class="sbrand">${logoMark(34)}<div><b>Gayane Torosyan</b><span>English Reading Room</span></div><button class="theme-t" id="themeBtn" type="button">${ICO.sun}${ICO.moon}</button></div>
  ${isTeacher()||sessionOK?`<a class="back" href="./${c.back}" id="back">${ICO.chevL}${esc(c.backLabel)}</a>`:""}
  <header class="essay-head">
    <h1>${esc(c.head)}</h1>
    <p class="meta"><span class="lv">B1–B2</span>${c.meta.map(m=>`<span>${esc(m)}</span>`).join("")}</p>
  </header>${inner}`;
}
function xBind(){ const b=byId("back"); if(b) b.onclick=ev=>{ ev.preventDefault(); go(X_.ctx.back); }; bindThemeBtn("en"); }
function xGapsHTML(text,fill){         // "(11) ____" gaps, filled with the chosen answer
  return esc(text).replace(/\((\d+)\)\s*_{3,}/g,(m,n)=>`<span class="xgap" data-gap="${n}"><b>${n}</b>${esc(fill(+n)||"")}</span>`);
}
function xParas(html,numbered){ return html.split(/\n\s*\n/).map((p,i)=>`<p>${numbered?`<span class="pn">${i+1}</span>`:""}${p}</p>`).join(""); }
function xMcFill(n){ const r=xFindItem(n); if(!r||r.s.type!=="mc") return ""; const v=X_.ans[n]; return Number.isInteger(v)?r.it.o[v]:""; }
function xFindItem(n){ for(const s of X_.t.sections) for(const g of s.groups) for(const it of g.items) if(it.n===n) return {s,g,it}; return null; }
function xOrderText(it,val,review){
  let k=0;
  return xParas(esc(it.text).replace(/_{2,}/g,()=>{ const j=k++; const v=val&&val[j];
    if(review) return `<span class="xgap"><b>${j+1}</b>${esc(it.words[it.a[j]-1])}</span>`;
    return `<select class="xsel" data-ord="${it.n}" data-k="${j}" aria-label="Gap ${j+1}"><option value="">${j+1} …</option>${it.words.map((w,i)=>`<option value="${i+1}"${v===i+1?" selected":""}>${i+1}. ${esc(w)}</option>`).join("")}</select>`; }));
}
function xSecHTML(s){
  const A=X_.ans;
  const body=s.groups.map(g=>{
    let h="";
    if(g.text&&s.type==="mc") h+=`<div class="xtext">${xParas(xGapsHTML(g.text,xMcFill),s.key==="I")}</div>`;
    h+=g.items.map(it=>{
      const v=A[it.n];
      if(s.type==="mc"){
        const long=it.o.some(o=>o.length>22);
        return `<div class="xitem"><p class="xq"><span class="xn">${it.n}</span><span>${it.q?esc(it.q):`<span style="color:var(--muted);font-weight:500">Gap (${it.n})</span>`}</span></p>
          <div class="xopts${long?" long":""}">${it.o.map((o,j)=>`<button class="xopt" type="button" data-x="${it.n}" data-o="${j}" aria-pressed="${v===j}"><b>${"abcd"[j]}</b><span>${esc(o)}</span></button>`).join("")}</div></div>`;
      }
      if(s.type==="multi"){
        const sel=Array.isArray(v)?v:[];
        return `<div class="xitem"><p class="xq"><span class="xn">${it.n}</span><span>Choose all the correct ones.</span></p>
          ${it.s.map((x,j)=>`<button class="xchk" type="button" data-x="${it.n}" data-m="${j+1}" aria-pressed="${sel.includes(j+1)}"><i>${j+1}</i><span>${Array.isArray(x)?`<small>${esc(x[0])}</small><b>${esc(x[1])}</b>`:esc(x)}</span></button>`).join("")}</div>`;
      }
      if(s.type==="order"){
        return `<div class="xitem"><p class="xq"><span class="xn">${it.n}</span><span>Choose a word for each gap (1–5).</span></p>
          <div class="xwords">${it.words.map((w,i)=>`<span><b>${i+1}</b>${esc(w)}</span>`).join("")}</div>
          <div class="xtext">${xOrderText(it,v)}</div></div>`;
      }
      const val=Array.isArray(v)?v:[];
      return `<div class="xitem"><p class="xq"><span class="xn">${it.n}</span><span>Match A–D with 1–${it.right.length}.</span></p>
        <ol class="xright">${it.right.map((r,i)=>`<li><b>${i+1})</b><span>${esc(r)}</span></li>`).join("")}</ol>
        <div class="xpairs">${it.left.map((l,i)=>`<label class="xpair"><span><b>${"ABCD"[i]})</b>${esc(l)}</span>
          <select class="xsel" data-mat="${it.n}" data-k="${i}" aria-label="${"ABCD"[i]}"><option value="">—</option>${it.right.map((_,r)=>`<option value="${r+1}"${val[i]===r+1?" selected":""}>${r+1}</option>`).join("")}</select></label>`).join("")}</div></div>`;
    }).join("");
    return h;
  }).join("");
  return `<section class="xsec" id="xSec"><p class="gn">Section ${s.key} · ${xRange(s).includes("–")?"Tasks":"Task"} ${xRange(s)}</p><p class="xins">${esc(s.en)}</p><p class="xins-hy">${esc(s.hy)}</p>${body}</section>`;
}
function xCounts(){
  const all=xItems(X_.t), done=all.filter(({s,it})=>xAnswered(s,X_.ans[it.n])).length;
  return {all:all.length, done};
}
function xTabState(s){
  const its=s.groups.flatMap(g=>g.items), d=its.filter(it=>xAnswered(s,X_.ans[it.n])).length;
  return d===its.length?"done":d?"part":"";
}
function xRender(){
  const t=X_.t, s=t.sections[X_.sec], last=X_.sec===t.sections.length-1, c=xCounts();
  app.innerHTML=xShell(`
  <div class="gprog"><div class="gbar"><i style="width:${Math.round(c.done/c.all*100)}%"></i></div><span id="xCount">${c.done} / ${c.all}</span></div>
  ${t.sections.length>1?`<nav class="xtabs" aria-label="Sections">${t.sections.map((x,i)=>`<button type="button" data-sec="${i}" class="${xTabState(x)}${i===X_.sec?" cur":""}" aria-label="Section ${x.key}">${x.key}</button>`).join("")}</nav>`:""}
  ${xSecHTML(s)}
  <div class="gnav">
    <button class="btn btn-ghost" id="xPrev" type="button" ${X_.sec===0?"disabled":""}>${ICO.chevL}Back</button>
    ${last?`<button class="btn btn-main" id="xFin" type="button">${ICO.check}Finish</button>`:`<button class="btn btn-main" id="xNext" type="button">Next${ICO.chevR}</button>`}
  </div>
  <div id="gWarn"></div>
  <p class="gnote" style="text-align:center">You will see the correct answers at the end. Your answers are saved on this phone.</p>`);
  xBind();
  const cur=app.querySelector(".xtabs .cur"); if(cur&&cur.scrollIntoView) try{ cur.scrollIntoView({block:"nearest",inline:"center"}); }catch{}
  const goSec=i=>{ X_.sec=i; xSave(); xRender(); window.scrollTo({top:Math.max(0,(app.querySelector(".gprog")||app).offsetTop-12)}); };
  app.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>goSec(+b.dataset.sec));
  byId("xPrev").onclick=()=>goSec(X_.sec-1);
  const nx=byId("xNext"); if(nx) nx.onclick=()=>goSec(X_.sec+1);
  const fin=byId("xFin"); if(fin) fin.onclick=xTryFinish;
  const refresh=()=>{ xSave(); const c=xCounts(); const cn=byId("xCount"); if(cn) cn.textContent=`${c.done} / ${c.all}`;
    const bar=app.querySelector(".gbar i"); if(bar) bar.style.width=Math.round(c.done/c.all*100)+"%";
    const tb=app.querySelector(`[data-sec="${X_.sec}"]`); if(tb) tb.className=`${xTabState(s)} cur`; };
  app.querySelectorAll(".xopt").forEach(b=>b.onclick=()=>{
    const n=+b.dataset.x, j=+b.dataset.o; X_.ans[n]=j;
    app.querySelectorAll(`.xopt[data-x="${n}"]`).forEach(x=>x.setAttribute("aria-pressed",x===b));
    const gap=app.querySelector(`.xgap[data-gap="${n}"]`); if(gap) gap.innerHTML=`<b>${n}</b>${esc(xMcFill(n))}`;
    refresh();
  });
  app.querySelectorAll(".xchk").forEach(b=>b.onclick=()=>{
    const n=+b.dataset.x, m=+b.dataset.m, cur=Array.isArray(X_.ans[n])?X_.ans[n]:[];
    X_.ans[n]=cur.includes(m)?cur.filter(x=>x!==m):[...cur,m].sort((a,b)=>a-b);
    b.setAttribute("aria-pressed",X_.ans[n].includes(m)); refresh();
  });
  app.querySelectorAll("[data-ord],[data-mat]").forEach(sel=>sel.onchange=()=>{
    const n=+(sel.dataset.ord||sel.dataset.mat), k=+sel.dataset.k, r=xFindItem(n).it;
    const len=sel.dataset.ord?r.a.length:r.left.length;
    const cur=Array.isArray(X_.ans[n])?X_.ans[n].slice():Array(len).fill(null);
    cur[k]=sel.value?+sel.value:null; X_.ans[n]=cur; refresh();
  });
}
function xTryFinish(){
  const miss=xItems(X_.t).filter(({s,it})=>!xAnswered(s,X_.ans[it.n])).map(({it})=>it.n);
  if(!miss.length){ xResults(); return; }
  const w=byId("gWarn"); if(!w) return;
  w.innerHTML=`<div class="gwarn" role="alert"><p>${miss.length===1?"1 task is":miss.length+" tasks are"} not answered yet: ${miss.slice(0,15).join(", ")}${miss.length>15?"…":""}</p>
    <div class="gnav"><button class="btn btn-ghost" id="gGo" type="button">Go to ${miss[0]}</button><button class="btn btn-main" id="gAny" type="button">Finish anyway</button></div></div>`;
  byId("gGo").onclick=()=>{ X_.sec=X_.t.sections.findIndex(s=>s.groups.some(g=>g.items.some(it=>it.n===miss[0]))); xRender(); };
  byId("gAny").onclick=xResults;
  w.scrollIntoView({block:"nearest",behavior:REDUCED()?"auto":"smooth"});
}
function xGapSentence(s,it){
  const g=s.groups.find(g=>g.items.includes(it)); if(!g||!g.text) return `Gap ${it.n}`;
  const sent=(g.text.match(/[^.!?]*[.!?]+["”]?/g)||[g.text]).find(x=>x.includes(`(${it.n})`))||"";
  return esc(sent.trim()).replace(/\((\d+)\)\s*_{3,}/g,(m,n)=>+n===it.n?`<span class="gbl">${esc(it.o[it.a])}</span>`:"_____");
}
function xYours(s,it,v){
  if(!xAnswered(s,v)) return "—";
  if(s.type==="mc") return `${"abcd"[v]}) ${it.o[v]}`;
  if(s.type==="multi") return v.join(", ");
  if(s.type==="order") return v.map(x=>x?`${x}`:"–").join(", ");
  return v.map((x,i)=>`${"ABCD"[i]}–${x||"?"}`).join(", ");
}
function xCorrect(s,it){
  if(s.type==="mc") return `${"abcd"[it.a]}) ${it.o[it.a]}`;
  if(s.type==="multi") return it.a.join(", ");
  if(s.type==="order") return it.a.join(", ")+"  ("+it.a.map(x=>it.words[x-1]).join(", ")+")";
  return it.a.map((x,i)=>`${"ABCD"[i]}–${x}`).join(", ");
}
function xResults(){
  const t=X_.t, A=X_.ans;
  const rows=xItems(t).map(({s,it})=>({s,it,ok:xRight(s,it,A[it.n])}));
  const right=rows.filter(r=>r.ok).length, n=rows.length, pct=Math.round(right/n*100);
  const [title,sub]=pct>=90?["Excellent! 🌟","You are ready for the exam."]:pct>=75?["Very good! 🎉","Look at the red tasks and you will be even better."]:pct>=50?["Good work! 👍","Study the sections with the lowest score."]:["Keep practising 💪","Read the correct answers carefully and try again."];
  try{ localStorage.removeItem(xKey(t.id)); }catch{}
  let name=""; try{ name=localStorage.getItem("rr-student-name")||""; }catch{}
  const bySec=t.sections.map(s=>{ const r=rows.filter(x=>x.s===s); return {s, ok:r.filter(x=>x.ok).length, all:r.length}; });
  const rev=onlyWrong=>t.sections.map(s=>{
    const rs=rows.filter(r=>r.s===s&&(!onlyWrong||!r.ok)); if(!rs.length) return "";
    return (t.sections.length>1?`<h3>Section ${s.key} · ${esc(s.en)}</h3>`:"")+rs.map(({it,ok})=>{
      let q="";
      if(s.type==="mc") q=it.q?esc(it.q).replace(/\n/g," "):xGapSentence(s,it);
      else if(s.type==="order") q=`<span class="xtext" style="display:block;margin:6px 0 0;font-size:.95rem">${xOrderText(it,null,true)}</span>`;
      else if(s.type==="multi") q=it.s.map((x,j)=>`<span style="display:block;font-size:.9rem;${it.a.includes(j+1)?"color:var(--good)":"opacity:.75"}">${j+1}. ${esc(Array.isArray(x)?x[1]:x)}</span>`).join("");
      else q=it.left.map((l,i)=>`<span style="display:block;font-size:.9rem">${"ABCD"[i]}) ${esc(l)} → <b style="color:var(--good)">${it.a[i]}) ${esc(it.right[it.a[i]-1])}</b></span>`).join("");
      return `<div class="gr${ok?"":" no"}"><p><span class="gk">${it.n}.</span>${q}</p><p class="ya">${ok?`✓ ${esc(xCorrect(s,it))}`:`Your answer: <s>${esc(xYours(s,it,A[it.n]))}</s> · Correct: <b>${esc(xCorrect(s,it))}</b>`}</p></div>`;
    }).join("");
  }).join("");
  const wrongN=n-right;
  app.innerHTML=xShell(`
  <section class="gres">
    <div class="gring" style="--p:${pct};--ringc:${pct>=50?"var(--good)":"#E8A317"}"><div><b>${right}/${n}</b><small>${pct}%</small></div></div>
    <h2>${title}</h2><p>${sub}</p>
    ${t.sections.length>1?`<table class="xtable">${bySec.map(b=>`<tr><td><b>${b.s.key}</b></td><td style="width:55%"><div class="bar"><i style="width:${Math.round(b.ok/b.all*100)}%"></i></div></td><td>${b.ok}/${b.all}</td></tr>`).join("")}</table>`:""}
    <div class="gnav" style="margin-top:16px"><button class="btn btn-ghost" id="xAgain" type="button">${ICO.repeat1}Start again</button></div>
    <div class="gname"><input id="gName" type="text" placeholder="Your name" autocomplete="name" value="${esc(name)}" aria-label="Your name"><button class="btn btn-main" id="gSend" type="button" style="flex:none">${ICO.send}Send result</button></div>
  </section>
  ${wrongN?`<div class="gfilter"><button class="chip" id="fAll" aria-pressed="true" type="button">All (${n})</button><button class="chip" id="fWrong" aria-pressed="false" type="button">Mistakes (${wrongN})</button></div>`:""}
  <section class="grev xrev" id="gRev">${rev(false)}</section>`);
  xBind(); window.scrollTo(0,0);
  if(pct>=75) chime();
  byId("xAgain").onclick=()=>{ X_.ans={}; X_.sec=0; xSave(); xRender(); window.scrollTo(0,0); };
  byId("gSend").onclick=async()=>{
    const nm=byId("gName").value.trim(); try{ localStorage.setItem("rr-student-name",nm); }catch{}
    const txt=`📝 ${X_.ctx.head}${X_.ctx.meta.length>1?" · "+X_.ctx.meta[1]:""}\n${nm?nm+": ":""}${right} / ${n} (${pct}%)\n`+(t.sections.length>1?bySec.map(b=>`${b.s.key}: ${b.ok}/${b.all}`).join(" · ")+"\n":"")+linkFor(t);
    if(navigator.share){ try{ await navigator.share({text:txt}); return; }catch(err){ if(err&&err.name==="AbortError") return; } }
    window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank","noopener");
  };
  const fa=byId("fAll"), fw=byId("fWrong");
  if(fa&&fw){ const set=only=>{ fa.setAttribute("aria-pressed",!only); fw.setAttribute("aria-pressed",only); byId("gRev").innerHTML=rev(only); };
    fa.onclick=()=>set(false); fw.onclick=()=>set(true); }
}

/* ================= Practice by section (bank.js): the 13 exam task types ================= */
let bankP=null;
function loadBank(){
  if(window.BANK) return Promise.resolve(window.BANK);
  return bankP||(bankP=new Promise((res,rej)=>{
    const s=document.createElement("script"); s.src="bank.js";
    s.onload=()=>res(window.BANK||[]); s.onerror=()=>{ bankP=null; s.remove(); rej(new Error("bank")); };
    document.head.appendChild(s);
  }));
}
const BNK=()=>window.BANK||[];
function bFind(id){ for(const sec of BNK()) for(const [i,t] of sec.sets.entries()) if(t.id===id) return {sec,t,i}; return null; }
const bCtx=(sec,i,t)=>({head:sec.en, meta:[`Section ${sec.key}`,`Set ${i+1}`,`${t.count} tasks`], back:`?bl=${sec.key}`, backLabel:sec.hy});
const bObj=(sec,i,t)=>({id:t.id, title:`${sec.en} · Set ${i+1}`, level:"B2", chip:`Section ${sec.key} · ${t.count} tasks`, topic:"Practice"});
function bMessage(sec,i,t){ return `${BRAND}\n\n📝 ${sec.en} (Section ${sec.key})\nSet ${i+1} · ${t.count} tasks\n\nDo the exercise and see your score 👇\n${linkFor(t)}`; }
function bHead(){
  return `<header>
    <div class="brand">${logoMark(52)}<div><h1>Gayane Torosyan</h1><p class="tag">English Reading Room</p></div><div class="outs"><button class="theme-t" id="themeBtn" type="button">${ICO.sun}${ICO.moon}</button><button class="out" id="logout" aria-label="Դուրս գալ" title="Դուրս գալ">${ICO.logout}</button></div></div>
  </header>`;
}
async function teacherBank(key){
  if(!isTeacher()&&!sessionOK){ lockScreen(); return; }
  const seq=++gramSeq;
  document.title="Բաժիններ | Gayane Torosyan";
  app.innerHTML=LOADING;
  try{ await loadBank(); }catch{ if(seq===gramSeq) app.innerHTML=`<p class="gload">Չհաջողվեց բեռնել։ Ստուգիր ինտերնետը և թարմացրու էջը։</p>`; return; }
  if(seq!==gramSeq) return;
  const B=BNK(), sec=B.find(x=>x.key===key);
  const total=B.reduce((a,x)=>a+x.sets.reduce((b,t)=>b+t.count,0),0);
  if(!sec){
    app.innerHTML=bHead()+`
  <a class="back" href="./" id="lvBack">${ICO.chevL}Գլխավոր</a>
  <div class="lvhead bcard" style="--lv:var(--B2)"><span class="lvbig">I–XIII</span><div><h2>Բաժիններ</h2><p>Միասնական քննության 13 բաժինները՝ առանձին · ${total} առաջադրանք</p></div></div>
  <section class="lvgrid rise">${B.map((x,i)=>{ const n=x.sets.reduce((a,t)=>a+t.count,0); return `
    <a class="lvcard bsec" href="?bl=${x.key}" data-bl="${x.key}" style="--lv:var(--B2);--d:${Math.min(i,10)}">
      <span class="lvbig">${x.key}</span>
      <span class="lvtxt"><b>${esc(x.hy)}</b><small>${esc(x.en)} · ${x.sets.length} փաթեթ</small></span>
      <span class="lvn">${n}<small>առաջ.</small></span>${ICO.chevR}
    </a>`; }).join("")}</section>`;
    byId("lvBack").onclick=ev=>{ ev.preventDefault(); go(baseUrl()); };
    app.querySelectorAll("[data-bl]").forEach(a=>a.onclick=ev=>{ ev.preventDefault(); go("?bl="+a.dataset.bl); });
  }else{
    const s0=sec.sets[0].sections[0];
    app.innerHTML=bHead()+`
  <a class="back" href="./?bl" id="lvBack">${ICO.chevL}Բաժիններ</a>
  <div class="lvhead bcard" style="--lv:var(--B2)"><span class="lvbig">${sec.key}</span><div><h2>${esc(sec.hy)}</h2><p>${esc(s0.hy)}</p></div></div>
  <section class="list rise">${sec.sets.map((t,i)=>`
    <article class="item" style="--lv:var(--B2);--d:${Math.min(i,10)}">
      <h2><span class="num">${i+1}</span>Փաթեթ ${i+1}</h2>
      <p class="meta"><span class="lv">${sec.key}</span><span>${esc(sec.en)}</span><span>${t.count} առաջադրանք</span></p>
      <div class="actions">
        <button class="btn btn-main" data-bshare="${t.id}">Ուղարկել</button>
        <a class="btn btn-ghost" href="?b=${t.id}" data-bgo="${t.id}">Դիտել</a>
      </div>
    </article>`).join("")}</section>`;
    byId("lvBack").onclick=ev=>{ ev.preventDefault(); go("?bl"); };
    app.querySelectorAll("[data-bgo]").forEach(a=>a.onclick=ev=>{ ev.preventDefault(); go("?b="+a.dataset.bgo); });
    app.querySelectorAll("[data-bshare]").forEach(b=>b.onclick=()=>{ const r=bFind(b.dataset.bshare); if(r) linkSheet({title:`${r.sec.hy} · Փաթեթ ${r.i+1}`, sub:`${r.sec.en} · ${r.t.count} առաջադրանք`, lv:r.sec.key, msg:bMessage(r.sec,r.i,r.t), link:linkFor(r.t), qr:bObj(r.sec,r.i,r.t)}); });
  }
  byId("logout").onclick=logout;
  bindThemeBtn("hy");
}
async function bankStudent(id){
  const seq=++gramSeq;
  app.innerHTML=LOADING;
  let r=window.BANK?bFind(id):null;
  if(!r&&!window.BANK){ const part=await loadPart(id); if(part&&part.sec) r={sec:part.sec,i:part.i,t:part.t}; }
  if(!r&&!window.BANK){ try{ await loadBank(); r=bFind(id); }catch{ if(seq===gramSeq) app.innerHTML=`<p class="gload">Could not load the exercise. Check the internet and reload the page.</p>`; return; } }
  if(seq!==gramSeq) return;
  if(!r){ teacher(); return; }
  xOpen(r.t,bCtx(r.sec,r.i,r.t));
}
