<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F7FB">
<title>Gayane Torosyan | English Reading Room</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Gayane English">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Noto+Sans+Armenian:wght@400;500;600;700&family=Noto+Serif+Armenian:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7FB; --surface:#FFFFFF; --ink:#172241; --muted:#5A6583; --line:#DDE3EE;
  --marker:#FFE17A; --good:#1E8A5A; --bad:#C23B3B; --accent:#3E5FD9;
  --A1:#2E9E6A; --A2:#1C8AA3; --B1:#3E5FD9; --B2:#7A4FD6; --C1:#B23F78;
  --ui:"Noto Sans Armenian","Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --read:"Literata","Noto Serif Armenian",Georgia,serif;
  --shadow:0 1px 2px rgba(23,34,65,.06),0 8px 24px rgba(23,34,65,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#10162A; --surface:#19213A; --ink:#E9EDF7; --muted:#A4AFC9; --line:#2B3654; --marker:#6E5B10;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --paper:#10162A; --surface:#19213A; --ink:#E9EDF7; --muted:#A4AFC9; --line:#2B3654; --marker:#6E5B10;
  --shadow:none;
}
:root{--read2:"Atkinson Hyperlegible","Noto Sans Armenian",system-ui,-apple-system,"Segoe UI",sans-serif}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 80px}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- Teacher ---------- */
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;
  background:conic-gradient(from 200deg,var(--A1),var(--A2),var(--B1),var(--B2),var(--C1),var(--A1));color:#fff}
.brand h1{font-family:var(--read);font-size:2rem;line-height:1.1;margin:0}
.lead{color:var(--muted);margin:10px 0 22px;max-width:52ch}
.levels{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 16px;scrollbar-width:none}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lv);margin-right:6px;vertical-align:1px}
.list{display:grid;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.item::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--lv)}
.item h2{font-family:var(--read);font-size:1.22rem;line-height:1.25;margin:0 0 6px}
.meta{color:var(--muted);font-size:.9rem;margin:0 0 14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.lv{display:inline-block;background:var(--lv);color:#fff;font-weight:700;font-size:.78rem;border-radius:6px;padding:2px 8px}
.actions{display:flex;gap:8px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-main{background:var(--ink);color:var(--paper);flex:1}
.btn-ghost{background:transparent;border:1.5px solid var(--line)}

.outs{margin-left:auto;display:flex;gap:6px}
.out{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:.85rem;color:var(--muted)}
.lock{max-width:340px;margin:12vh auto 0;text-align:center}
.lock .logo{margin:0 auto 14px;width:56px;height:56px;font-size:1.6rem}
.lock h1{font-family:var(--read);font-size:2rem;margin:0}
.lock .lead{margin:6px auto 26px}
.lock form{text-align:left;display:grid;gap:6px}
.pin{font:inherit;font-size:1.5rem;letter-spacing:.4em;text-align:center;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.err{color:var(--bad);min-height:1.4em;margin:2px 0 6px;font-size:.9rem}
.lock .btn-main{padding:13px}

.mark{display:block;border-radius:22%;flex:none}
.brand .tag,.lock .tag{margin:2px 0 0;color:var(--muted);font-family:var(--read);font-size:.95rem;letter-spacing:.02em}
.brand h1{font-size:1.7rem}
.lock .mark.big{margin:0 auto 16px;width:84px;height:84px}
.lock .lead{margin-top:18px}
.sbrand{display:flex;align-items:center;gap:10px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.sbrand b{display:block;font-family:var(--read);font-size:1rem;line-height:1.2}
.sbrand span{color:var(--muted);font-size:.8rem}

.w{border-radius:3px;cursor:pointer;touch-action:manipulation}
.w.key{text-decoration:underline dotted;text-decoration-color:var(--lv);text-decoration-thickness:2px;text-underline-offset:4px}
.w.sel{background:color-mix(in srgb,var(--accent) 24%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 50%,transparent)}
@media (hover:hover){.w:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}}
:root[data-font="sans"] .text{font-family:var(--read2);letter-spacing:.012em;word-spacing:.08em}
body.focus .sbrand,body.focus .essay-head .meta,body.focus .hint,body.focus .back{display:none}
body.focus .text{line-height:2.05}
body.focus.playing .text .s:not(.on){opacity:.32;transition:opacity .3s}
.wcard{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0 auto;max-width:560px;min-height:190px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(10,15,30,.25);padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .22s ease}
.wcard.show{transform:none}
.wc-x{position:absolute;right:8px;top:6px;border:0;background:transparent;font-size:1.7rem;line-height:1;padding:4px 10px;color:var(--muted)}
.wc-word{display:flex;align-items:center;gap:8px;padding-right:44px;font-family:var(--read);font-size:1.5rem}
.wc-tr{margin:6px 0 4px;min-height:2.3em}
.tr-arm{display:block;font-size:1.4rem;font-weight:600}
.tr-note{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.tr-fail{color:var(--muted);font-size:.92rem}
.wc-def{color:var(--muted);font-size:.9rem;min-height:1.3em;margin-bottom:10px}
.wc-act .btn{padding:9px 14px}
body.wc-open .wrap{padding-bottom:270px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 6px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.switch{display:flex;gap:12px;align-items:flex-start;margin:16px 0 4px}
.switch input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent)}
.switch small{display:block;color:var(--muted)}

/* Share sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:20;opacity:0;transition:opacity .2s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;
  padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;
  transform:translateY(100%);transition:transform .25s ease;max-height:88vh;overflow:auto}
.sheet.show{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:var(--read);margin:0 0 2px;font-size:1.2rem}
.sheet .sub{color:var(--muted);font-size:.9rem;margin:0 0 16px}
.big{width:100%;display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.big b{display:block}
.big small{color:var(--muted)}
.big .ic{font-size:1.4rem;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tri{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);text-align:center}
.tri .ic{font-size:1.6rem}
.tri b{font-size:1rem}
.tri small{color:var(--muted);font-size:.74rem;line-height:1.25}
.tri.main{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tri.main small{color:inherit;opacity:.75}
.tri:disabled{opacity:.45;cursor:not-allowed}
.apps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 14px}
.app{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.78rem;padding:6px 0;text-decoration:none}
.app i{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;font-style:normal}
.app svg{width:26px;height:26px;fill:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row .btn{border:1.5px solid var(--line);background:transparent;font-size:.92rem;padding:10px 8px}
.label{font-size:.85rem;color:var(--muted);margin:6px 0 4px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:30;transition:.2s;max-width:90vw;text-align:center;font-size:.92rem}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Student ---------- */
.back{color:var(--muted);text-decoration:none;font-size:.9rem}
.essay-head h1{font-family:var(--read);font-size:2.2rem;line-height:1.12;margin:14px 0 10px}
.player{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:8px 0 10px;margin:10px 0 4px;border-bottom:1px solid var(--line)}
.scrub2{display:flex;align-items:center;gap:8px}
.tm{min-width:34px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
#tdur{text-align:right}
.scrub{position:relative;flex:1;height:28px}
#seek{-webkit-appearance:none;appearance:none;width:100%;height:28px;margin:0;background:transparent;cursor:pointer;position:relative;z-index:1}
#seek::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(to right,var(--lv) var(--p,0%),var(--line) var(--p,0%))}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--ink);border:3px solid var(--paper);margin-top:-7px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
#seek::-moz-range-track{height:6px;border-radius:6px;background:var(--line)}
#seek::-moz-range-progress{height:6px;border-radius:6px;background:var(--lv)}
#seek::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--paper)}
.ticks{position:absolute;left:10px;right:10px;top:50%;height:12px;transform:translateY(-50%);pointer-events:none}
.ticks i{position:absolute;top:0;width:2px;height:12px;margin-left:-1px;border-radius:1px;background:var(--ink);opacity:.22}
.pctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin-top:2px}
.pb{min-width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:1rem;padding:0 8px}
.pb small{font-size:.62rem;margin-left:1px}
.play{background:var(--ink);color:var(--paper);border:0;border-radius:999px;width:54px;height:54px;font-size:1.15rem;font-weight:700}
.speed{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;height:36px;padding:0 12px;font-weight:600;min-width:52px}
.speed.on,.speed[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.aa{margin-left:auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-weight:700;font-family:var(--read)}
.hint{color:var(--muted);font-size:.85rem;margin:8px 0 18px}
.text{font-family:var(--read);font-size:var(--tsize,1.2rem);line-height:1.78;max-width:66ch}
.text p{margin:0 0 1em}
.s{border-radius:4px;cursor:pointer;background-image:linear-gradient(var(--marker),var(--marker));background-repeat:no-repeat;background-size:0% 100%;transition:background-size .45s cubic-bezier(.3,.7,.2,1)}
.s.on{background-size:100% 100%}
.sec{font-size:1.15rem;margin:36px 0 12px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.word{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.word b{font-family:var(--read)}
.word span{color:var(--muted);font-size:.92rem;text-align:right;flex:1}
.say{border:0;background:transparent;font-size:1rem;padding:2px}
.q{min-width:0;margin:0 0 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.q p{margin:0 0 10px;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:8px}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt.right{background:color-mix(in srgb,var(--good) 16%,transparent)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 16%,transparent)}
.check{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:13px 18px;font-weight:700;width:100%;margin-top:6px}
.score{font-family:var(--read);font-size:1.4rem;text-align:center;margin:18px 0 0}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:.9rem}
/* motion */
.mark svg{display:block;width:100%;height:100%}
.anim .st{animation:stIn .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.35s + var(--i)*.08s)}
.anim .pg{animation:pgIn .55s cubic-bezier(.2,.8,.2,1) both .12s;transform-origin:256px 392px}
.anim .mono{animation:fadeIn .6s ease both}
@keyframes stIn{from{transform:translateY(34px);opacity:0}}
@keyframes pgIn{from{transform:scaleY(.35);opacity:0}}
@keyframes fadeIn{from{opacity:0}}
.list.rise .item{animation:rise .38s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d)*28ms)}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.opt.right.flash{animation:pop .4s ease}
.opt.wrong.flash{animation:nudge .35s ease}
@keyframes pop{40%{transform:scale(1.025)}}
@keyframes nudge{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.btn,.chip,.tri,.play,.check,.speed,.pb,.app{transition:transform .12s ease}
.btn:active,.chip:active,.tri:active:not(:disabled),.play:active,.check:active,.speed:active,.pb:active,.app:active{transform:scale(.96)}
.score.win{animation:pop .5s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>

<main class="wrap" id="app"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

/* audio availability cache */
const audioOK = {};
async function hasAudio(id){
  if(id in audioOK) return audioOK[id];
  if(location.protocol==="file:") return audioOK[id]=false;
  try{ const r=await fetch(AUDIO_DIR+id+".mp3",{method:"HEAD"}); audioOK[id]=r.ok; }
  catch{ audioOK[id]=false; }
  return audioOK[id];
}

function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),2600);
}
async function copy(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch{
    const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); let ok=false; try{ok=document.execCommand("copy")}catch{} ta.remove(); return ok;
  }
}

}

/* ================= Lock ================= */
const LS_KEY="reading-room-teacher";
async function sha256(t){
  if(!(window.crypto&&crypto.subtle)) return null;
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function isTeacher(){ try{ return localStorage.getItem(LS_KEY)===TEACHER_PIN_HASH; }catch{ return sessionOK; } }
let sessionOK=false;
function lockScreen(){
  document.title="Gayane Torosyan | English Reading Room";
  app.innerHTML=`
  <section class="lock">
    ${logoMark(84,"big anim")}
    <h1>Gayane Torosyan</h1>
    <p class="tag">English Reading Room</p>
    <p class="lead">🔒 Մուտք միայն ուսուցչի համար</p>
    <form id="lockForm" autocomplete="off">
      <label for="pin" class="label">PIN կոդ</label>
      <input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
      <p class="err" id="err" aria-live="polite"></p>
      <button class="btn btn-main" type="submit">Մուտք</button>
    </form>
  </section>`;
  const pin=document.getElementById("pin"); pin.focus();
  document.getElementById("lockForm").onsubmit=async ev=>{
    ev.preventDefault();
    const h=await sha256(pin.value.trim());
    const err=document.getElementById("err");
    if(!err||!pin.isConnected) return;       // the page changed while checking
    if(h===TEACHER_PIN_HASH){
      sessionOK=true; try{ localStorage.setItem(LS_KEY,h); }catch{}
      teacher();
    }else{
      err.textContent= h===null
        ? "Բացիր կայքը https:// հասցեով (օր.՝ GitHub Pages-ով)"
        : "Սխալ PIN, փորձիր նորից";
      pin.value=""; pin.focus();
    }
  };
}
function logout(){ sessionOK=false; try{ localStorage.removeItem(LS_KEY); }catch{} lockScreen(); }

const BRAND = "📘 Gayane Torosyan | English Reading Room";
function message(e){

}
function fullLesson(e){
  const lines=[BRAND,"━━━━━━━━━━━━━━━━",`📖 ${e.title} (${e.level})`,"",...e.text.flatMap(p=>[p,""]),
    "📝 New words:",...e.words.map(w=>`• ${w[0]} — ${w[1]}`),"",
    "❓ Questions:",...e.qs.map((q,i)=>`${i+1}. ${q[0]}\n   ${q[1].slice().sort().map((o,j)=>String.fromCharCode(97+j)+") "+o).join("   ")}`),"",

}

/* ================= Reading comfort (saved on the phone) ================= */
const PREF_KEY="reading-room-prefs";
const SIZES=[1.0,1.2,1.4,1.65];
let prefs={size:1,font:"serif",theme:"auto",focus:false};
function loadPrefs(){
  try{
    const j=JSON.parse(localStorage.getItem(PREF_KEY)||"{}");
    if(j&&typeof j==="object"){
      if(Number.isInteger(j.size)&&j.size>=0&&j.size<SIZES.length) prefs.size=j.size;
      if(j.font==="serif"||j.font==="sans") prefs.font=j.font;
      if(j.theme==="auto"||j.theme==="light"||j.theme==="dark") prefs.theme=j.theme;
      prefs.focus=j.focus===true;
    }
  }catch{}
}
function savePrefs(){ try{ localStorage.setItem(PREF_KEY,JSON.stringify(prefs)); }catch{} }
function applyPrefs(){
  const r=document.documentElement;
  r.style.setProperty("--tsize",SIZES[prefs.size]+"rem");
  r.dataset.font=prefs.font;
  if(prefs.theme==="auto") delete r.dataset.theme; else r.dataset.theme=prefs.theme;
  document.body.classList.toggle("focus",prefs.focus);
  let dark=prefs.theme==="dark";
  try{ if(prefs.theme==="auto") dark=matchMedia("(prefers-color-scheme: dark)").matches; }catch{}
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content",dark?"#10162A":"#F5F7FB");
}
function openComfort(withFocus){
  if(sheetBusy||sheetEl) return;
  document.querySelectorAll(".sheet,.backdrop").forEach(n=>n.remove());
  const bd=document.createElement("div"); bd.className="backdrop";
  const sh=document.createElement("div"); sh.className="sheet"; sh.setAttribute("role","dialog"); sh.setAttribute("aria-modal","true"); sh.setAttribute("aria-label","Reading comfort");
  const seg=(k,opts)=>`<div class="seg" data-k="${k}">${opts.map(o=>`<button type="button" data-v="${o[0]}" style="${o[2]||""}">${o[1]}</button>`).join("")}</div>`;
  sh.innerHTML=`<div class="grab"></div>
    <h3>Reading comfort</h3><p class="sub">Your choices are saved on this phone.</p>
    <p class="label">Text size</p>${seg("size",[[0,"A","font-size:.85rem"],[1,"A","font-size:1.05rem"],[2,"A","font-size:1.3rem"],[3,"A","font-size:1.6rem"]])}
    <p class="label">Font</p>${seg("font",[["serif","Book style"],["sans","Easy to read"]])}
    <p class="label">Theme</p>${seg("theme",[["auto","Auto"],["light","Light"],["dark","Dark"]])}
    ${withFocus?`<label class="switch"><input type="checkbox" id="focusSw"><span><b>Focus mode</b><small>Hides distractions and dims everything except the sentence being read</small></span></label>`:""}
    <div class="row" style="margin-top:14px"><button class="btn" id="cmReset">Reset</button><button class="btn" id="cmClose">Done</button></div>`;
  document.body.append(bd,sh); sheetEl={bd,sh};
  requestAnimationFrame(()=>{bd.classList.add("show");sh.classList.add("show")});
  const paint=()=>{
    sh.querySelectorAll(".seg").forEach(g=>g.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(String(prefs[g.dataset.k])===b.dataset.v))));
    const f=sh.querySelector("#focusSw"); if(f) f.checked=prefs.focus;
  };
  sh.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
    const k=b.parentNode.dataset.k, v=b.dataset.v; prefs[k]=k==="size"?+v:v; savePrefs(); applyPrefs(); paint();
  });
  const f=sh.querySelector("#focusSw"); if(f) f.onchange=()=>{ prefs.focus=f.checked; savePrefs(); applyPrefs(); };
  sh.querySelector("#cmReset").onclick=()=>{ prefs={size:1,font:"serif",theme:"auto",focus:false}; savePrefs(); applyPrefs(); paint(); };
  sh.querySelector("#cmClose").onclick=()=>closeSheet();
  bd.onclick=()=>closeSheet();
  document.addEventListener("keydown",escClose);
  paint();
}

let audioEl=null, starts=null, span=null, fracs=[];
let loopOn=false, loopIdx=-1, scrubbing=false, scrubT=0, playerReady=false, keyWords=new Map();
const RATES=[0.75,0.9,1,1.25]; let rate=0.9;
const split=p=>p.match(/[^.!?]+[.!?]+["”]?\s*|[^.!?]+$/g)||[p];
const fmt=t=>{ t=+t; t=isFinite(t)&&t>0?Math.floor(t):0; return Math.floor(t/60)+":"+String(t%60).padStart(2,"0"); };
function seekAudio(t){ if(audioEl&&isFinite(t)&&t>=0){ try{ audioEl.currentTime=t; }catch{} } }   // never set a non-finite time (browsers throw)

/* ---- tap a word: translation ---- */
const normWord=w=>w.toLowerCase().replace(/[’]/g,"'").replace(/'s$/,"").replace(/^['-]+|['-]+$/g,"");
function buildKeys(e){
  const m=new Map();
  (e.words||[]).forEach(p=>{
    const en=String(p[0]), hy=String(p[1]);
    const base=en.replace(/\s*\(.*?\)/g,"").trim(), par=(en.match(/\(([^)]*)\)/)||[])[1];
    [base,par].forEach(h=>{ if(h&&!/\s/.test(h)) m.set(normWord(h),hy); });
  });
  return m;
}
function lookupCurated(w){
  if(keyWords.has(w)) return keyWords.get(w);
  const stem=w.replace(/(ing|ed|es|s|ly|d)$/,"");
  for(const s of [stem,stem+"e"]) if(s.length>2&&keyWords.has(s)) return keyWords.get(s);
  return null;
}
function wordify(s){
  return s.replace(/([A-Za-z][A-Za-z'’-]*)|([^A-Za-z]+)/g,(m,w,o)=>{
    if(!w) return esc(o);
    const n=normWord(w); if(!n) return esc(w);
    return `<span class="w${lookupCurated(n)?" key":""}" data-w="${esc(n)}">${esc(w)}</span>`;
  });
}
const TR_KEY="reading-room-translations"; let trMem=null;
function trCache(){
  if(!trMem){ try{ trMem=JSON.parse(localStorage.getItem(TR_KEY)||"{}"); }catch{ trMem={}; } if(!trMem||typeof trMem!=="object"||Array.isArray(trMem)) trMem={}; }
  return trMem;
}
function trSave(){
  try{ const k=Object.keys(trMem); if(k.length>800) k.slice(0,k.length-800).forEach(x=>delete trMem[x]); localStorage.setItem(TR_KEY,JSON.stringify(trMem)); }catch{}
}
async function fetchJson(url,ms=7000){
  const c=typeof AbortController!=="undefined"?new AbortController():null;
  const t=c?setTimeout(()=>c.abort(),ms):0;
  try{ const r=await fetch(url,c?{signal:c.signal}:undefined); if(!r||!r.ok) throw new Error("http"); return await r.json(); }
  finally{ clearTimeout(t); }
}
function decodeEntities(t){ const ta=document.createElement("textarea"); ta.innerHTML=t; return ta.value; }
async function translateWord(w){
  const mem=trCache();
  if(typeof mem[w]==="string") return mem[w];
  const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(w)+"&langpair=en|hy-AM"+(MYMEMORY_EMAIL?"&de="+encodeURIComponent(MYMEMORY_EMAIL):"");
  const d=await fetchJson(url);
  let t=d&&d.responseData&&d.responseData.translatedText;
  if(typeof t!=="string"||+d.responseStatus!==200) throw new Error("bad");
  t=decodeEntities(t).trim();
  if(/MYMEMORY WARNING|INVALID|QUERY LENGTH|PLEASE SELECT/i.test(t)||!/[\u0531-\u058F]/.test(t)||t.length>80) throw new Error("bad");
  mem[w]=t; trSave(); return t;
}
const defMem=new Map();
async function defineWord(w){
  if(defMem.has(w)) return defMem.get(w);
  const d=await fetchJson("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(w));
  let out=null;
  const m=Array.isArray(d)&&d[0]&&Array.isArray(d[0].meanings)?d[0].meanings[0]:null;
  const df=m&&Array.isArray(m.definitions)?m.definitions[0]:null;
  if(df&&typeof df.definition==="string") out={pos:typeof m.partOfSpeech==="string"?m.partOfSpeech:"",def:df.definition};
  defMem.set(w,out); return out;
}

  else translateWord(w).then(t=>{ if(my===wcToken) trEl.innerHTML=`<span class="tr-arm">${esc(t)}</span><span class="tr-note">automatic translation, may be approximate</span>`; })

  defineWord(w).then(d=>{ if(my===wcToken&&d) defEl.textContent=(d.pos?d.pos+": ":"")+d.def; }).catch(()=>{});
}

/* ---- player (YouTube-style) ---- */
async function setupPlayer(e){
  const myRoute=++token;
  const mp3=await hasAudio(e.id);
  if(myRoute!==token) return;
  if(mp3){
    const a=new Audio(AUDIO_DIR+e.id+".mp3"); a.preload="metadata"; a.playbackRate=rate;
    let st=null, sp=null;
    try{
      const r=await fetch(AUDIO_DIR+e.id+".json");
      if(r.ok){
        const j=await r.json();
        const list=Array.isArray(j)?j:(j&&j.starts)||[];
        if(!Array.isArray(j)&&j&&j.end>j.start) sp={start:+j.start,end:+j.end};
        if(Array.isArray(list)&&list.length===sentences.length&&list.every(x=>typeof x==="number"&&isFinite(x))) st=list;
      }
    }catch{}
    if(myRoute!==token) return;
    audioEl=a; starts=st; span=sp;
    a.onloadedmetadata=setupSeek; a.ondurationchange=setupSeek;
    a.ontimeupdate=onTime;
    a.onended=()=>{ playing=false; mark(-1); setBtn(); updateSeek(); };
    setupMediaSession(e);
  }else if(!("speechSynthesis" in window)){
    byId("noaudio").hidden=false; return;
  }else pickVoice();
  if(!byId("player")) return;
  playerReady=true;
  byId("player").hidden=false; byId("hint").hidden=false; byId("hint2").hidden=true;
  if(!audioEl){ byId("back10").hidden=true; byId("fwd10").hidden=true; }
  setupSeek(); setBtn();
  byId("play").onclick=()=>playing?pause():playFrom(audioEl?null:cur);
  byId("prevS").onclick=()=>stepSentence(-1);
  byId("nextS").onclick=()=>stepSentence(1);
  byId("back10").onclick=()=>skipBy(-10);
  byId("fwd10").onclick=()=>skipBy(10);
  byId("speed").onclick=ev=>{
    rate=RATES[(RATES.indexOf(rate)+1)%RATES.length]; ev.currentTarget.textContent=`${rate}×`;
    if(audioEl) audioEl.playbackRate=rate; else if(playing) playFrom(cur);
  };
  byId("loop").onclick=ev=>{
    loopOn=!loopOn; ev.currentTarget.setAttribute("aria-pressed",String(loopOn)); ev.currentTarget.classList.toggle("on",loopOn);
    if(loopOn){ const i=curIndex(); if(i<0||i>=sentences.length){ gotoSentence(0); loopIdx=0; } else loopIdx=i; } else loopIdx=-1;
  };
  const sk=byId("seek");
  sk.addEventListener("input",()=>{
    scrubbing=true; clearTimeout(scrubT); scrubT=setTimeout(()=>{scrubbing=false},1500);
    const v=+sk.value, max=+sk.max||1;
    sk.style.setProperty("--p",Math.min(100,v/max*100)+"%");
    byId("tcur").textContent=audioEl?fmt(v):`${Math.round(v)+1}/${sentences.length}`;
  });
  sk.addEventListener("change",()=>{
    clearTimeout(scrubT); scrubbing=false;
    const v=+sk.value; if(!isFinite(v)) return;
    if(audioEl){
      const d=audioEl.duration;
      seekAudio(Math.max(0,isFinite(d)&&d>0?Math.min(v,d-0.05):v));
      const i=sentenceAt(audioEl.currentTime,audioEl.duration||0); mark(i);
      if(loopOn&&i>=0) loopIdx=i;
    }else gotoSentence(Math.round(v));
    updateSeek();
  });
}
function setupMediaSession(e){
  try{
    if(!("mediaSession" in navigator)||typeof MediaMetadata==="undefined") return;
    navigator.mediaSession.metadata=new MediaMetadata({title:e.title,artist:"Gayane Torosyan",album:"English Reading Room"});
    const set=(n,f)=>{ try{ navigator.mediaSession.setActionHandler(n,f); }catch{} };
    set("play",()=>playFrom(null)); set("pause",pause);
    set("previoustrack",()=>stepSentence(-1)); set("nexttrack",()=>stepSentence(1));
    set("seekbackward",()=>skipBy(-10)); set("seekforward",()=>skipBy(10));
  }catch{}
}
function setupSeek(){
  const sk=byId("seek"); if(!sk) return;
  if(audioEl){
    const d=audioEl.duration;
    if(isFinite(d)&&d>0){ sk.max=String(d); sk.step="0.1"; byId("tdur").textContent=fmt(d); drawTicks(d); }
  }else{
    sk.min="0"; sk.max=String(Math.max(0,sentences.length-1)); sk.step="1"; byId("tdur").textContent="";
  }
  updateSeek();
}
function drawTicks(d){
  const t=byId("ticks"); if(!t||!(d>0)) return;
  t.innerHTML=sentences.map((_,i)=>{ const x=timeOf(i)/d*100; return x>=0&&x<=100?`<i style="left:${x.toFixed(2)}%"></i>`:""; }).join("");
}
function updateSeek(){
  const sk=byId("seek"); if(!sk||scrubbing) return;
  let v, max=+sk.max||0;
  if(audioEl){ v=audioEl.currentTime||0; byId("tcur").textContent=fmt(v); }
  else{ v=cur; byId("tcur").textContent=`${Math.min(cur+1,sentences.length)}/${sentences.length}`; }
  sk.value=String(v);
  sk.style.setProperty("--p",(max>0?Math.max(0,Math.min(100,v/max*100)):0)+"%");
}
function onTime(){
  if(!audioEl) return;
  const d=audioEl.duration||0, t=audioEl.currentTime||0;
  updateSeek();
  if(playing) mark(sentenceAt(t,d));
  if(loopOn&&playing&&loopIdx>=0&&loopIdx<sentences.length){      // repeat one sentence
    const a=timeOf(loopIdx), b=loopIdx+1<sentences.length?timeOf(loopIdx+1):(span?span.end:d);
    if(b>a+0.2&&t>=b-0.02) seekAudio(a);
  }
}
function curIndex(){
  if(audioEl){
    const t=audioEl.currentTime||0, i=sentenceAt(t,audioEl.duration||0);
    if(i>=0) return i;
    const a=span?span.start:(starts?starts[0]:0);
    return t<a?-1:sentences.length;
  }
  return cur;
}
function gotoSentence(i){
  i=Math.max(0,Math.min(sentences.length-1,i));
  if(audioEl){ seekAudio(timeOf(i)); mark(i); if(loopOn) loopIdx=i; }
  else{ cur=i; mark(i); if(playing) playFrom(i); }
  updateSeek();
}
function stepSentence(dir){
  const i=curIndex();
  if(dir<0){
    if(audioEl&&i>=0&&i<sentences.length&&(audioEl.currentTime-timeOf(i))>1.5) return gotoSentence(i);   // first: back to the start of this sentence
    return gotoSentence(Math.max(0,i-1));
  }
  return gotoSentence(i+1);
}
function skipBy(s){
  if(!audioEl) return;
  const d=audioEl.duration||Infinity;
  seekAudio(Math.max(0,Math.min(d-0.05,(audioEl.currentTime||0)+s)));
  mark(sentenceAt(audioEl.currentTime,audioEl.duration||0)); updateSeek();
}

function playFrom(i){
  if(audioEl){
    if(i!=null){
      if(loopOn) loopIdx=i;
      const seek=()=>seekAudio(timeOf(i));
      audioEl.readyState>=1?seek():audioEl.addEventListener("loadedmetadata",seek,{once:true});
    }
    playing=true; setBtn(); audioEl.play().catch(()=>{playing=false;setBtn()}); return;
  }
  speechSynthesis.cancel();
  if(i==null||i>=sentences.length) i=0;
  cur=i; playing=true; setBtn();
  const my=++token;
  const next=()=>{
    if(my!==token||!playing) return;
    if(cur>=sentences.length){playing=false;cur=0;mark(-1);setBtn();updateSeek();return}
    mark(cur); updateSeek();
    const u=utter(sentences[cur]);
    u.onend=()=>{ if(my===token&&playing){ if(!loopOn) cur++; next(); } };
    u.onerror=()=>{ if(my===token){ playing=false; setBtn(); } };
    speechSynthesis.speak(u);
  };
  next();
}
// which sentence is being read at time t (-1 = sound logo, title or outro)
function sentenceAt(t,d){
  if(starts){
    if(t<starts[0]-0.05||(span&&t>span.end)) return -1;
    let i=0; while(i+1<starts.length&&starts[i+1]<=t) i++; return i;
  }
  const a=span?span.start:0, b=span?span.end:d;
  if(!(b>a)||t<a||t>b) return -1;
  const f=(t-a)/(b-a); let i=0; while(i+1<fracs.length&&fracs[i+1]<=f) i++; return i;
}
function timeOf(i){
  if(starts) return starts[i];
  const dd=audioEl&&isFinite(audioEl.duration)?audioEl.duration:0;
  const a=span?span.start:0, b=span?span.end:dd;
  return b>a?a+fracs[i]*(b-a):a;
}
function pause(){
  playing=false; setBtn();
  if(audioEl) audioEl.pause(); else if("speechSynthesis" in window){token++;speechSynthesis.cancel();}
}
function stopAll(){
  playing=false; token++; cur=0; starts=null; span=null; lastMark=-2;
  loopOn=false; loopIdx=-1; scrubbing=false; playerReady=false;
  document.body.classList.remove("playing");
  if(audioEl){audioEl.pause();audioEl=null;}
  if("speechSynthesis" in window) speechSynthesis.cancel();
}
function pickVoice(){
  const choose=()=>{
    const v=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
    voice=v.find(x=>/Google UK English Female|Samantha|Daniel|Google US English|Karen|Serena/i.test(x.name))||v.find(x=>/en[-_]GB/i.test(x.lang))||v[0]||null;
  };
  choose(); speechSynthesis.onvoiceschanged=choose;
}
function utter(text){ const u=new SpeechSynthesisUtterance(text); u.lang=voice?voice.lang:"en-GB"; if(voice)u.voice=voice; u.rate=rate; return u; }
function sayOnce(t){ if("speechSynthesis" in window){ speechSynthesis.cancel(); speechSynthesis.speak(utter(t)); } }
let lastMark=-2;
function mark(i){
  if(i===lastMark) return; lastMark=i;
  app.querySelectorAll(".s.on").forEach(s=>s.classList.remove("on"));
  const s=app.querySelector(`.s[data-i="${i}"]`);
  if(s){ s.classList.add("on"); s.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); }
}
function setBtn(){
  const b=byId("play"); if(b){ b.textContent=playing?"❚❚":"▶"; b.setAttribute("aria-label",playing?"Pause":"Play"); }
  document.body.classList.toggle("playing",playing);
}

function checkQuiz(e){
  let right=0, answered=0;
  e.qs.forEach((_,qi)=>{
    const inputs=[...app.querySelectorAll(`input[name=q${qi}]`)];
    const chosen=inputs.find(i=>i.checked);
    inputs.forEach(inp=>{ const l=inp.closest(".opt"); l.classList.remove("right","wrong","flash"); });
    if(!chosen) return;                       // unanswered: don't reveal the answer
    answered++;
    inputs.forEach(inp=>{
      const l=inp.closest(".opt");
      if(l.dataset.ok==="true") l.classList.add("right");
      if(inp===chosen&&l.dataset.ok!=="true") l.classList.add("wrong");
    });
    if(chosen.closest(".opt").dataset.ok==="true") right++;
    void app.offsetWidth;                     // restart the small animation on every check
    inputs.forEach(inp=>{ const l=inp.closest(".opt"); if(l.classList.contains("right")||l.classList.contains("wrong")) l.classList.add("flash"); });
  });
  const sc=document.getElementById("score"), n=e.qs.length, perfect=answered===n&&right===n;
  sc.classList.remove("win");
  if(answered<n){ sc.textContent=`You answered ${answered} of ${n}. Correct: ${right}. Answer all the questions.`; return; }
  const tail=perfect?" 🎉 Excellent!":" Read it again and try once more!";
  if(REDUCED()){ sc.textContent=`You got ${right} of ${n}.${tail}`; }
  else{
    let k=0; sc.textContent=`You got 0 of ${n}.`;
    const step=()=>{ sc.textContent=`You got ${k} of ${n}.${k===right?tail:""}`; if(k<right){ k++; setTimeout(step,140); } };
    step();
  }
  if(perfect){ void sc.offsetWidth; sc.classList.add("win"); chime(); }
}

loadPrefs(); applyPrefs();
window.addEventListener("popstate",route);
route();
</script>
