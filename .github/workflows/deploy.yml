name: Build voices and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PIN: ${{ secrets.TEACHER_PIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check essays
        run: python check_essays.py

      - name: Make voices (only new essays)
        run: |
          pip install edge-tts
          python make_audio.py

      - name: Save voices to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || (git commit -m "Add voices" && git push)

      - name: Set teacher PIN
        if: env.PIN != ''
        run: |
          H=$(printf '%s' "$PIN" | sha256sum | cut -d' ' -f1)
          sed -i "s/const TEACHER_PIN_HASH = \"[0-9a-f]*\"/const TEACHER_PIN_HASH = \"$H\"/" index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
