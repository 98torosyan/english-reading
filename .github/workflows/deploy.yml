name: Build voices and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PIN: ${{ secrets.TEACHER_PIN }}
      FONT: /tmp/Literata.ttf
      BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tools
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          pip install -q edge-tts fonttools cairosvg pillow numpy
          curl -sL -o "$FONT" "https://raw.githubusercontent.com/google/fonts/main/ofl/literata/Literata%5Bopsz%2Cwght%5D.ttf"
          if [ -d tests ]; then (cd tests && npm i -s jsdom@24 --no-save); fi

      - name: Make the sound logo
        run: python make_chime.py

      - name: Make the logo files (only if missing)
        run: |
          if [ ! -f icon.svg ] || [ ! -f apple-touch-icon.png ] || [ ! -f favicon-32.png ]; then
            python - <<'PYEOF'
          import os
          FONTPATH=os.environ.get('FONT','/tmp/Literata.ttf')
          from fontTools.ttLib import TTFont
          from fontTools.varLib.instancer import instantiateVariableFont
          from fontTools.pens.svgPathPen import SVGPathPen
          from fontTools.pens.transformPen import TransformPen
          from fontTools.pens.boundsPen import BoundsPen

          def inst(opsz,wght):
              return instantiateVariableFont(TTFont(__import__('os').environ.get('FONT','/tmp/Literata.ttf')),{"opsz":opsz,"wght":wght})
          F_BIG=inst(72,600); F_TXT=inst(36,600); F_SUB=inst(12,500)

          def text_path(font,s,size,x,y,anchor="start",track=0):
              gs=font.getGlyphSet(); cmap=font.getBestCmap(); upm=font['head'].unitsPerEm
              sc=size/upm; hmtx=font['hmtx']
              names=[cmap[ord(c)] for c in s]
              width=sum(hmtx[n][0] for n in names)*sc+track*(len(s)-1)
              if anchor=="middle": x-=width/2
              pen=SVGPathPen(gs); cx=x
              for n in names:
                  tp=TransformPen(pen,(sc,0,0,-sc,cx,y)); gs[n].draw(tp); cx+=hmtx[n][0]*sc+track
              return pen.getCommands(),width

          LV=["#2E9E6A","#1C8AA3","#3E5FD9","#7A4FD6","#B23F78"]
          INK="#172241"; PAPER="#FFFFFF"

          def book(cx,cy,s):
              # open book; spine at (cx,cy); s = scale (1 => 512 icon)
              def P(x,y): return f"{cx+x*s:.1f},{cy+y*s:.1f}"
              out=[]
              # five coloured page edges under the pages = the five levels
              for i,c in enumerate(reversed(LV)):
                  d=(4-i)*9
                  out.append(f'<path d="M{P(0,20+d)} C{P(-58,-8+d)} {P(-128,-14+d)} {P(-176,2+d)} L{P(-176,-14+d)} C{P(-128,-30+d)} {P(-58,-24+d)} {P(0,4+d)} C{P(58,-24+d)} {P(128,-30+d)} {P(176,-14+d)} L{P(176,2+d)} C{P(128,-14+d)} {P(58,-8+d)} {P(0,20+d)}Z" fill="{c}"/>')
              # white pages
              out.append(f'<path d="M{P(0,20)} C{P(-58,-8)} {P(-128,-14)} {P(-176,2)} L{P(-176,-112)} C{P(-128,-128)} {P(-58,-122)} {P(0,-92)} C{P(58,-122)} {P(128,-128)} {P(176,-112)} L{P(176,2)} C{P(128,-14)} {P(58,-8)} {P(0,20)}Z" fill="{PAPER}"/>')
              # spine + text lines
              out.append(f'<path d="M{P(0,-92)} L{P(0,20)}" stroke="{INK}" stroke-opacity=".18" stroke-width="{3*s:.1f}"/>')
              for k in range(3):
                  y=-86+k*26
                  out.append(f'<path d="M{P(-150,y)} C{P(-110,y-10)} {P(-60,y-8)} {P(-22,y+8)} M{P(22,y+8)} C{P(60,y-8)} {P(110,y-10)} {P(150,y)}" fill="none" stroke="{INK}" stroke-opacity=".16" stroke-width="{5*s:.1f}" stroke-linecap="round"/>')
              return "\n".join(out)

          def icon_svg(size=512):
              mono,_=text_path(F_BIG,"GT",150,256,212,"middle",track=-4)
              return f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="{size}" height="{size}">
          <rect width="512" height="512" rx="112" fill="{INK}"/>
          <path d="{mono}" fill="{PAPER}"/>
          {book(256,392,1.0)}
          </svg>'''

          def logo_svg():
              mono,_=text_path(F_BIG,"GT",150,256,212,"middle",track=-4)
              name,w1=text_path(F_TXT,"Gayane Torosyan",64,560,250)
              sub,w2=text_path(F_SUB,"English Reading Room",30,564,306,track=1.5)
              W=int(560+max(w1,w2)+40)
              return f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {W} 512" width="{W}" height="512">
          <rect width="512" height="512" rx="112" fill="{INK}"/>
          <path d="{mono}" fill="{PAPER}"/>
          {book(256,392,1.0)}
          <path d="{name}" fill="{INK}"/>
          <path d="{sub}" fill="#5A6583"/>
          <g>{"".join(f'<rect x="{564+i*46}" y="330" width="38" height="8" rx="4" fill="{c}"/>' for i,c in enumerate(LV))}</g>
          </svg>'''

          open('icon.svg','w').write(icon_svg())
          open('logo.svg','w').write(logo_svg())
          import cairosvg
          for n,sz in [('icon-512.png',512),('apple-touch-icon.png',180),('favicon-32.png',32)]:
              cairosvg.svg2png(url='icon.svg',write_to=n,output_width=sz,output_height=sz)
          print("ok")
          PYEOF
          fi

      - name: Check essays
        run: python check_essays.py

      - name: Chaos tests (Python)
        run: |
          if [ -f tests/test_python.py ]; then python tests/test_python.py; else echo "tests folder not uploaded - skipped"; fi

      - name: Chaos tests (website)
        run: |
          if [ -f tests/chaos.js ]; then node tests/chaos.js; else echo "tests folder not uploaded - skipped"; fi

      - name: Make voices (only new essays)
        run: python make_audio.py

      - name: Build branded lesson previews
        run: python build_pages.py

      - name: Save voices and previews to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio l og
          git diff --cached --quiet || (git commit -m "Add voices and previews" && git push)

      - name: Set teacher PIN
        if: env.PIN != ''
        run: |
          H=$(printf '%s' "$PIN" | sha256sum | cut -d' ' -f1)
          sed -i "s/const TEACHER_PIN_HASH = \"[0-9a-f]*\"/const TEACHER_PIN_HASH = \"$H\"/" index.html

      - name: Remove test tools from the site
        run: rm -rf tests/node_modules

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
